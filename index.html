const SKILLS = {
  margin:{name:'Margin Cut',key:'Q',cd:7,col:INK,wins:0,desc:'cleave and revise the crowd outward'},
  redline:{name:'Redline Volley',key:'Q',cd:9,col:RUBRIC,wins:1,desc:'write seven piercing lines across the page'},
  bloom:{name:'Black Bloom',key:'Q',cd:11,col:BLUEIN,wins:2,desc:'cast three chained scorch seals over cover'},
};
function castSkill(id){
  const p=G.player,S=SKILLS[id]; if(!p||!S||activeSkillId()!==id||(G.skills[id]||0)>0)return;
  const mw=mouseWorld(),a=angTo(p.x,p.y,mw.x,mw.y); p.face=a; G.skills[id]=S.cd;
  if(id==='margin'){
    const reach=175,arc=2.15;
    G.swings.push({x:p.x,y:p.y,a,arc,reach,t:0,dur:0.32,dmg:18*implPower(),hit:{},skill:true});
    for(const e of G.enemies){
      if(dist2(p.x,p.y,e.x,e.y)>reach*reach||Math.abs(angDiff(angTo(p.x,p.y,e.x,e.y),a))>arc/2)continue;
      e.vx+=Math.cos(a)*460;e.vy+=Math.sin(a)*460;
    }
    // Margin Cut can literally revise collapsed type out of the path. Natural
    // cover remains permanent, so the player still has tactical separators.
    for(let i=G.walls.length-1;i>=0;i--){
      const w=G.walls[i];if(w.kind!=='type')continue;
      const wa=angTo(p.x,p.y,w.x,w.y);
      if(dist2(p.x,p.y,w.x,w.y)>reach*reach||Math.abs(angDiff(wa,a))>arc/2)continue;
      w.hp-=48;fx(w.x,w.y,RUBRIC,9);
      if(w.hp<=0){G.walls.splice(i,1);G.runMats.heartwood=(G.runMats.heartwood||0)+2;floater('+2 HEARTWOOD',w.x,w.y-25,VERD);}
    }
    say('MARGIN CUT','the crowd is revised outward');
  }else if(id==='redline'){
    for(let i=-3;i<=3;i++)G.projectiles.push({x:p.x,y:p.y,a:a+i*.075,spd:760,dmg:13*implPower(),kind:'shot',life:0,travel:0,range:980,pierce:3,forked:true,r:4,skill:true});
    G.shake=Math.max(G.shake,5);say('REDLINE VOLLEY','seven rulings cross the page');
  }else if(id==='bloom'){
    const d=Math.min(310,Math.hypot(mw.x-p.x,mw.y-p.y)),cx=p.x+Math.cos(a)*d,cy=p.y+Math.sin(a)*d;
    for(let i=0;i<3;i++){const q=i/3*TAU+G.t,x=cx+Math.cos(q)*72,y=cy+Math.sin(q)*72;addPool(x,y,82,5.5,true);burst(x,y,82,'lob');for(const e of G.enemies)if(dist2(x,y,e.x,e.y)<82*82)damageEnemy(e,34*implPower(),70,q);}
    say('BLACK BLOOM','three seals smoulder beyond the timber');
  }
  sfx('skill');
}
function resolveCircleBody(o,r,cx,cy,cr){
  const dx=o.x-cx,dy=o.y-cy,min=r+cr,d=Math.hypot(dx,dy);
  if(d>=min||d===0)return;
  const push=min-d;o.x+=dx/d*push;o.y+=dy/d*push;
}
function resolveWorldCollision(o,r){
  const threadsRoots=o.kind==='rootling';
  if(!threadsRoots)for(const t of G.trees) if(Math.abs(t.x-o.x)<45&&Math.abs(t.y-o.y)<45) resolveCircleBody(o,r,t.x,t.y,11*t.s);
  for(const w of G.walls){
    if(threadsRoots&&w.kind==='roots')continue;
    const l=w.x-w.w/2-r,rr=w.x+w.w/2+r,t=w.y-w.h/2-r,b=w.y+w.h/2+r;
    if(o.x>l&&o.x<rr&&o.y>t&&o.y<b){
      const dl=o.x-l,dr=rr-o.x,dt=o.y-t,db=b-o.y,m=Math.min(dl,dr,dt,db);
      if(m===dl)o.x=l;else if(m===dr)o.x=rr;else if(m===dt)o.y=t;else o.y=b;
    }
  }
  for(const L of G.landmarks){
    const cr=L.kind==='press'?55:L.kind==='well'?45:L.kind==='nest'?34:L.kind==='effigy'?22:0;
    if(cr)resolveCircleBody(o,r,L.x,L.y+12,cr);
  }
}

  const guideLabel=SV.tutorialDone?'REPLAY FIRST-RUN GUIDE':'FIRST-RUN GUIDE IS READY';
  const guideW=Math.min(210,bw-44);if(uiButton(W/2-guideW/2,y+bh-76,guideW,38,guideLabel,RUBRIC,true)){SV.tutorialDone=false;persist();}
  ctx.textAlign='center';ctx.fillStyle=INK2;ctx.font='500 11px Georgia,serif';ctx.fillText('Esc returns',W/2,y+bh-22);ctx.restore();
}
function drawArchive(){
  ctx.save();ctx.fillStyle=PARCH;ctx.fillRect(0,0,W,H);if(PAPER){ctx.fillStyle=PAPER;ctx.fillRect(0,0,W,H);}
  const creatures=G.archiveTab==='creatures',list=creatures?ENEMY_ORDER:CARDS;

    ctx.textAlign='center';ctx.fillStyle=INK2;ctx.font='600 11px Georgia,serif';ctx.fillText('CREATURE LEDGER  ·  ENTRY '+(i+1)+' OF '+ENEMY_ORDER.length,W/2,y+38);
    ctx.fillStyle=known?INK:'rgba(60,48,32,.42)';ctx.font='700 30px Georgia,serif';ctx.fillText(known?lore[0]:'AN UNSEEN CREATURE',W/2,y+82);
    ctx.strokeStyle=known?K.col:INK2;ctx.beginPath();ctx.moveTo(x+70,y+103);ctx.lineTo(x+bw-70,y+103);ctx.stroke();
    if(known){

      ctx.fillStyle=K.col;ctx.font='700 12px Georgia,serif';ctx.fillText(lore[1].toUpperCase(),W/2,y+305);
      wrap(lore[2],x+90,y+342,bw-180,19,INK,'500 14px Georgia,serif');
      ctx.textAlign='center';ctx.fillStyle=INK2;ctx.font='600 11px Georgia,serif';ctx.fillText(bossEntry?'VELLUM 5200  ·  PACE 52→70  ·  TWO PHASES  ·  FOUR ATTACK FORMS':'VELLUM '+K.hp+'  ·  PACE '+K.spd+'  ·  CONTACT '+K.dmg+'  ·  INK '+K.xp,W/2,y+410);
    }else{ctx.fillStyle=INK2;ctx.font='italic 15px Georgia,serif';ctx.fillText('Meet this creature in the Orchard to cut its form into the ledger.',W/2,y+250);}
  }else{
    const c=CARDS[i],known=!!SV.seen[c.id];
    ctx.textAlign='center';ctx.fillStyle=INK2;ctx.font='600 11px Georgia,serif';ctx.fillText('MANUSCRIPT LEDGER  ·  PAGE '+(i+1)+' OF '+CARDS.length,W/2,y+38);
    ctx.fillStyle=known?INK:'rgba(60,48,32,.42)';ctx.font='700 30px Georgia,serif';ctx.fillText(known?c.name:'AN UNWRITTEN PAGE',W/2,y+84);
    ctx.strokeStyle=known?MATERIALS[c.mat].col:INK2;ctx.beginPath();ctx.moveTo(x+70,y+105);ctx.lineTo(x+bw-70,y+105);ctx.stroke();
    if(known){const dk=MATERIALS[c.mat].kw;ctx.textAlign='left';ctx.fillStyle=VERD;ctx.font='700 12px Georgia,serif';ctx.fillText('THE GIFT',x+64,y+146);wrap(c.boon,x+64,y+174,bw-128,20,INK,'500 15px Georgia,serif');ctx.fillStyle=RUBRIC;ctx.font='700 12px Georgia,serif';ctx.fillText('WHAT IT WRITES INTO THE HORDE',x+64,y+246);wrap(c.curse,x+64,y+274,bw-128,20,RUBRIC,'italic 500 15px Georgia,serif');ctx.fillStyle=MATERIALS[c.mat].col;ctx.font='700 13px Georgia,serif';ctx.fillText('MATERIAL OPENED  ·  '+MATERIALS[c.mat].name.toUpperCase(),x+64,y+360);ctx.fillStyle=INK2;ctx.font='500 12px Georgia,serif';ctx.fillText('Use this material at the Ink-Forge to inscribe '+(dk?DOCTRINES[dk].name.toLowerCase():'unbound')+' gear.',x+64,y+387);ctx.fillStyle=MATERIALS[c.mat].col;ctx.font='700 11px Georgia,serif';ctx.fillText('CURRENTLY HELD  ·  '+SV.mats[c.mat],x+64,y+414);}else{ctx.fillStyle=INK2;ctx.font='italic 15px Georgia,serif';ctx.fillText('Choose this page during a descent to preserve its law here.',W/2,y+220);ctx.strokeStyle='rgba(60,48,32,.25)';for(let n=0;n<7;n++){ctx.beginPath();ctx.moveTo(x+90,y+270+n*24);ctx.lineTo(x+bw-90,y+270+n*24);ctx.stroke();}}
  }
  if(uiButton(x+34,y+bh-62,100,32,'← PREVIOUS',INK2,true))G.archivePage=(i+list.length-1)%list.length;
  if(uiButton(x+bw-134,y+bh-62,100,32,'NEXT →',INK2,true))G.archivePage=(i+1)%list.length;

const CRAFT_COST = r => ({0:6, 1:14, 2:30, 3:60})[r];

function drawForge(){
  ctx.save();
  ctx.fillStyle=PARCH; ctx.fillRect(0,0,W,H);
  ctx.textAlign='left';
  ctx.fillStyle=INK; ctx.font='700 30px Georgia, serif';
  ctx.fillText('THE FORGE', 34, 52);
  if(uiButton(W-174,28,140,28,'RETURN TO TOWN',INK2,true)){G.mode='town';G.turnT=.46;}ctx.textAlign='left';
  ctx.fillStyle=RUBRIC; ctx.font='italic 500 13px Georgia, serif';
  ctx.fillText('runs '+SV.runs+'  ·  wardens felled '+SV.wins+'  ·  longest '+fmtTime(SV.best), 34, 74);
  if(G.forgeMsg){ctx.textAlign='right';ctx.fillStyle=VERD;ctx.font='700 12px Georgia,serif';ctx.fillText(G.forgeMsg,W-34,76);ctx.textAlign='left';}

  // materials strip
  let mx = 34;
  for(const k of MAT_IDS){
    const M = MATERIALS[k];
    ctx.fillStyle = M.col; ctx.font='700 15px Georgia, serif';
    ctx.fillText(SV.mats[k], mx, 108);
    const wdt = ctx.measureText(SV.mats[k]).width;
    ctx.fillStyle = INK2; ctx.font='500 11px Georgia, serif';
    ctx.fillText(M.name, mx+wdt+6, 108);
    mx += wdt + 12 + ctx.measureText(M.name).width + 22;
  }

  /* ---- equipped loadout ---- */
  ctx.fillStyle=INK2; ctx.font='500 11px Georgia, serif';
  ctx.fillText('WORN', 34, 138);
  let y = 148;
  const cw = Math.min(400, W*0.34);
  for(const s of SLOTS){
    const it = SV.loadout[s];
    if(it){
      const h = drawItemCard(34, y, cw, it, SLOT_NAME[s], false);
      if(uiButton(34+cw-70, y+4, 62, 18, 'UNEQUIP', INK2, true)){
        SV.stash.push(it); SV.loadout[s]=null; persist(); recompute();
      }
      y += h + 8;
    } else {
      ctx.fillStyle='rgba(205,184,135,0.4)'; ctx.fillRect(34,y,cw,44);
      ctx.strokeStyle=INK2; ctx.lineWidth=1.4; ctx.setLineDash([5,4]);
      ctx.strokeRect(34.5,y+0.5,cw-1,43); ctx.setLineDash([]);
      ctx.fillStyle=INK2; ctx.font='italic 500 12px Georgia, serif'; ctx.textAlign='left';
      ctx.fillText(SLOT_NAME[s]+' — empty', 46, y+27);
      y += 52;
    }
  }

  /* ---- doctrine readout ---- */
  const doct = computeDoctrines(SV.loadout);
  const floor = H - 76;                    // never run under the Dive button
  let dy = y + 22;
  if(dy < floor){
    ctx.fillStyle=INK2; ctx.font='500 11px Georgia, serif';
    ctx.fillText('DOCTRINES', 34, dy);
    dy += 20;
    // if space is tight, drop the descriptions and keep just the counts
    const roomy = (floor - dy) > 84;
    for(const id of ['grave','ember','oath']){
      if(dy > floor) break;
      const D = DOCTRINES[id], n = doct[id];
      const dim = 'rgba(60,48,32,0.42)';
      ctx.fillStyle = n>=3 ? D.col : dim;
      ctx.font='700 14px Georgia, serif';
      ctx.fillText(D.name.toUpperCase()+'  '+n+'/3', 34, dy);
      const body = n>=5 ? D.t5 : D.t3;
      if(roomy){
        wrap(body, 130, dy, cw-110, 14, n>=3?INK:dim, '400 11px Georgia, serif');
        dy += Math.max(20, wrapH(body, cw-110, 14, '400 11px Georgia, serif')+6);
      } else dy += 20;
    }
  }

  /* ---- right column: craft + stash ---- */
  const rx = 34 + cw + 40;
  const rw = W - rx - 34;
  if(rw > 260){
    ctx.textAlign='left';
    // one cursor, and every label reserves its own line — no more collisions
    let by = 138;
    const label = txt => { ctx.fillStyle=INK2; ctx.font='500 11px Georgia, serif';
                           ctx.fillText(txt, rx, by); by += 16; };
    const ROW = 26, ROWGAP = 34;

    label('INSCRIBE NEW GEAR');
    let bx = rx;
    for(const s of SLOTS){
      if(bx + 84 > rx+rw){ bx = rx; by += ROWGAP; }
      if(uiButton(bx, by, 84, ROW, SLOT_NAME[s], G.craftSlot===s?RUBRIC:INK2, true)) G.craftSlot=s;
      bx += 90;
    }
    by += ROWGAP + 8;

    label('KEYWORD');
    bx = rx;
    for(const k of ['ember','grave','oath']){
      if(uiButton(bx, by, 84, ROW, DOCTRINES[k].name, G.craftKw===k?DOCTRINES[k].col:INK2, true)) G.craftKw=k;
      bx += 90;
    }
    by += ROWGAP + 8;

    if(G.craftSlot==='implement'){
      label('IMPLEMENT');
      bx = rx;
      for(const k of IMPL_KEYS){
        if(uiButton(bx, by, 96, ROW, IMPLEMENTS[k].name, G.craftBase===k?RUBRIC:INK2, true)) G.craftBase=k;
        bx += 102;
      }
      by += ROWGAP + 8;
      const inscribed=DEFAULT_SKILL_BY_IMPLEMENT[G.craftBase],open=skillUnlocked(inscribed);
      ctx.fillStyle=open?RUBRIC:'rgba(60,48,32,0.48)';ctx.font='600 10px Georgia,serif';
      ctx.fillText(open?'ACTIVE INSCRIPTION  —  Q  '+SKILLS[inscribed].name.toUpperCase()
        :'SEALED INSCRIPTION  —  '+SKILLS[inscribed].wins+' WARDEN'+(SKILLS[inscribed].wins===1?'':'S')+' REQUIRED',rx,by);
      by+=20;
      ctx.fillStyle=INK2;ctx.font='italic 500 10px Georgia,serif';ctx.fillText(IMPLEMENTS[G.craftBase].blurb,rx,by);by+=18;
    }

    // craft cost — the sentence that explains why the bestiary matters
    const mat = matForKw(G.craftKw);
    const costLine = 'paid in '+MATERIALS[mat].name+', which only drops if you write '
      +(G.craftKw==='ember'?'Emberbrand':G.craftKw==='grave'?'Grave-Rite':'Oathmark')+' into the horde.';
    wrap(costLine, rx, by, Math.min(rw, 420), 14, INK2, 'italic 500 11px Georgia, serif');
    by += wrapH(costLine, Math.min(rw,420), 14, 'italic 500 11px Georgia, serif') + 8;
    bx = rx;
    for(let r=1;r<=3;r++){
      const cost = CRAFT_COST(r);
      const can = SV.mats[mat] >= cost;
      if(uiButton(bx, by, 108, 34, RARITY[r].name+'  '+cost, can?RARITY[r].col:'rgba(60,48,32,0.35)') && can){
        SV.mats[mat] -= cost;
        const made=makeItem(G.craftSlot, r, G.craftKw, G.craftBase);SV.stash.push(made);G.forgeMsg='INSCRIBED  ·  '+made.name.toUpperCase();
        persist();
      }
      bx += 114;
    }
    by += 34 + 22;

    // stash
    label('STASH  ('+SV.stash.length+')');
    const maxY = H - 24;                          // Dive lives bottom-LEFT, so this column runs full height
    const sorted = SV.stash.slice().sort((a,b)=>scoreItem(b)-scoreItem(a));
    let shown = 0;
    for(const it of sorted){
      const est = 74 + it.affixes.length*17 + (it.slot==='implement'?18:0); // know the height BEFORE drawing it
      if(by + est > maxY){
        ctx.textAlign='left';
        ctx.fillStyle=INK2; ctx.font='italic 500 11px Georgia, serif'; ctx.textAlign='left';
        ctx.fillText('+'+(sorted.length-shown)+' more in the stash — shatter or equip to make room.', rx, by+12);
        break;
      }
      shown++;
      const h = drawItemCard(rx, by, Math.min(rw, 420), it, SLOT_NAME[it.slot], false);
      const bw2 = Math.min(rw,420);
      if(uiButton(rx+bw2-134, by+4, 62, 18, 'EQUIP', RUBRIC, true)){
        const old = SV.loadout[it.slot];
        SV.loadout[it.slot] = it;
        SV.stash.splice(SV.stash.indexOf(it),1);
        if(old) SV.stash.push(old);
        persist(); recompute();
      }
      if(uiButton(rx+bw2-68, by+4, 62, 18, 'SHATTER', INK2, true)){
        shatter(it); SV.stash.splice(SV.stash.indexOf(it),1); persist();
      }
      by += h + 8;
    }
  }

  // dive — bottom-left, clear of the stash column
  if(uiButton(34, H-64, Math.min(400, W*0.34), 44, 'DIVE — THE ROTTING ORCHARD', RUBRIC)) startRun();
  ctx.restore();
}

/* ================================================================= LOOP */
let last = 0, lastFrameAt = 0;
function frame(ts){
  const now = ts || performance.now();
  if(!last) last = now;
  let dt = (now - last)/1000; last = now;
  if(dt > 0.25) dt = 0.25;          // tab was away — never simulate the gap
  lastFrameAt = now;
  step(dt);
  canvas.style.cursor=G.mode==='run'?'crosshair':G.mode==='town'?'crosshair':'default';
  hint.textContent=({menu:'Enter open · O options',town:'WASD or click move · E enter · O options',forge:'Esc return to town',archive:'← → turn pages · Esc return',settings:'Esc return',run:'WASD move · mouse aim · Q skill · F equip · Esc pause',paused:'Esc continue · O options',levelup:'Click a page · or press 1 2 3',dead:'Space return to town',victory:'Space return to town'})[G.mode]||'';
  if(touch.used)hint.textContent=({menu:'tap to open',town:'tap to walk · tap a nearby door to enter',forge:'tap controls · tap Return for town',archive:'tap previous or next · tap Return for town',settings:'tap controls · tap Return',run:'left drag move · right drag aim · tap inscription',paused:'tap Continue or Options',levelup:'tap a page',dead:'tap to return',victory:'tap to return'})[G.mode]||hint.textContent;
  draw();
  mouse.clicked = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* Watchdog: a hidden/backgrounded panel stops firing rAF entirely, which would
   otherwise leave a black canvas and a frozen sim. Keep both alive. */
setInterval(()=>{
  const now = performance.now();
  if(now - lastFrameAt > 300){
    last = now; lastFrameAt = now;
    step(1/60);
    try{ draw(); }catch(e){}
    mouse.clicked = false;
  }
}, 250);

resize();
bakeArt();     // must follow resize(): the paper patterns are made from ctx
applySettings();

/* ============================================== headless test surface */
window.step = step;
window.draw = draw;
window.sim = function(seconds, dt){
  dt = dt || 1/60;
  const n = Math.round(seconds/dt);
  for(let i=0;i<n;i++) step(dt);
  return {
    t:+G.t.toFixed(2), mode:G.mode, hp:Math.round(G.player?G.player.hp:0),
    level:G.player?G.player.level:0, enemies:G.enemies.length, kills:G.kills,
    cards:G.cards.map(c=>c.id), doct:{...G.doct}, mats:{...G.runMats},
    pools:G.pools.length, minions:G.minions.length, boss:G.boss?Math.round(G.boss.hp):null,
  };
};
window.VELLUM = {
  get SV(){ return SV; },
  CARDS, AFFIXES, IMPLEMENTS, DOCTRINES, MATERIALS, RARITY, SLOTS,
  makeItem, computeDoctrines, startRun, takeCard, spawnEnemy, spawnBoss,
  recompute, dropGear, scoreItem, hasAffix, mouse,
  equip(it){ SV.loadout[it.slot] = it; recompute(); return it; },
  /* Aim the cursor at a world point — the only way a headless harness can
     drive aimed auto-fire, since the real input is a live mouse position. */
  aimAt(x,y){ mouse.x = x - G.cam.x + W/2; mouse.y = y - G.cam.y + H/2; },
  reset(){ SV = blankSave(); persist(); },
};
</script>
