<script>
"use strict";
/* ============================================================================
   VELLUM — a survivors-like where you write the bestiary that hunts you.
   The spine:  card -> horde trait -> material -> affix keyword -> Doctrine
   Single-file, 2D canvas, no dependencies.
   ==========================================================================*/

/* ---------------------------------------------------------------- palette */
const INK    = '#1c1712';
const INK2   = '#3a3025';
const PARCH  = '#e6d9b8';
const PARCH2 = '#dccaa2';
const PARCH3 = '#cdb887';
const RUBRIC = '#a4243b';
const RUBRIC2= '#c2453f';
const GOLD   = '#c9a227';
const GOLD2  = '#e8c95a';
const VERD   = '#5d6b3a';   // orchard green, muted like aged pigment
const BLUEIN = '#3d4a63';

/* ---------------------------------------------------------------- tuning */
const ZONE_TIME   = 480;    // seconds until the Orchard-Warden arrives (v0: 8 min)
const WORLD       = 2600;   // half-extent of the field
const MAX_ENEMIES = 420;

/* extra tones for the print: ink is never one flat black in a real impression */
const INK3   = '#2b241b';
const INKPALE= 'rgba(28,23,18,0.34)';
const PARCH4 = '#f2e8cc';

/* ---------------------------------------------------------------- helpers */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const rand  = (a=1,b=0) => b + Math.random()*(a-b);
const randi = n => (Math.random()*n)|0;
const pick  = arr => arr[(Math.random()*arr.length)|0];
const dist2 = (ax,ay,bx,by) => {const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const angTo = (ax,ay,bx,by) => Math.atan2(by-ay,bx-ax);
function angDiff(a,b){let d=(a-b)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d;}
let _uid = 1; const uid = () => _uid++;

/* ============================================================ ART ENGINE
   Everything here runs ONCE at load. Creatures, trees and the paper are baked
   into offscreen canvases, so the per-frame cost of a 400-strong horde is a
   drawImage each — which buys us as much carved detail as we care to draw.
   ==========================================================================*/

/* deterministic noise, so a given creature is carved the same way every load */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const SS = 2;                       // supersample the bakes so edges stay crisp
function offscreen(w,h){
  const c = document.createElement('canvas');
  c.width = Math.ceil(w*SS); c.height = Math.ceil(h*SS);
  const x = c.getContext('2d');
  x.scale(SS,SS);
  x.lineJoin = 'round'; x.lineCap = 'round';
  return {c, x, w, h};
}

/* A closed path whose vertices wander a little and whose segments bow — the
   difference between a vector ellipse and something cut out of a woodblock. */
function roughShape(x, pts, jitter, rng){
  const n = pts.length;
  const p = pts.map(q => [q[0] + (rng()-0.5)*jitter, q[1] + (rng()-0.5)*jitter]);
  x.beginPath();
  x.moveTo(p[0][0], p[0][1]);
  for(let i=0;i<n;i++){
    const a = p[i], b = p[(i+1)%n];
    const mx = (a[0]+b[0])/2 + (rng()-0.5)*jitter*1.6;
    const my = (a[1]+b[1])/2 + (rng()-0.5)*jitter*1.6;
    x.quadraticCurveTo(mx, my, b[0], b[1]);
  }
  x.closePath();
}
function ellipsePts(cx, cy, rx, ry, n, squashTop){
  const pts = [];
  for(let i=0;i<n;i++){
    const a = (i/n)*TAU;
    let ex = cx + Math.cos(a)*rx, ey = cy + Math.sin(a)*ry;
    if(squashTop && Math.sin(a) < 0) ey = cy + Math.sin(a)*ry*squashTop;
    pts.push([ex,ey]);
  }
  return pts;
}

/* Relief printing carves AWAY from black, so shading here is parchment-coloured
   lines cut into an ink field — not grey paint laid on top. */
function hatch(x, x0,y0,x1,y1, angle, gap, width, color, alpha, rng, ragged){
  x.save();
  x.globalAlpha = alpha;
  x.strokeStyle = color;
  x.lineWidth = width;
  x.lineCap = 'butt';
  const dx = Math.cos(angle), dy = Math.sin(angle);
  const px = -dy, py = dx;
  const cx = (x0+x1)/2, cy = (y0+y1)/2;
  const span = Math.hypot(x1-x0, y1-y0);
  const n = Math.ceil(span/gap)+2;
  for(let i=-n;i<=n;i++){
    const off = i*gap + (rng?(rng()-0.5)*gap*0.25:0);
    const ax = cx + px*off, ay = cy + py*off;
    const len = span*0.75 * (ragged&&rng ? (0.55+rng()*0.6) : 1);
    const slide = ragged&&rng ? (rng()-0.5)*span*0.3 : 0;
    x.beginPath();
    x.moveTo(ax - dx*len + dx*slide, ay - dy*len + dy*slide);
    x.lineTo(ax + dx*len + dx*slide, ay + dy*len + dy*slide);
    x.stroke();
  }
  x.restore();
}

/* Two slightly-offset strokes read as a real inked impression rather than a
   clean 1px vector outline. */
function inkOutline(x, color, w){
  x.save();
  x.strokeStyle = color; x.lineWidth = w; x.globalAlpha = 0.95; x.stroke();
  x.lineWidth = w*0.45; x.globalAlpha = 0.5;
  x.setLineDash([w*3, w*2.2]); x.stroke(); x.setLineDash([]);
  x.restore();
}

/* a gnarled limb: tapers, kinks, and forks into twigs */
function limb(x, x0,y0, ang, len, w, depth, rng, col){
  if(depth <= 0 || len < 2) return;
  const kink = (rng()-0.5)*0.5;
  const x1 = x0 + Math.cos(ang)*len, y1 = y0 + Math.sin(ang)*len;
  const mx = x0 + Math.cos(ang+kink)*len*0.5, my = y0 + Math.sin(ang+kink)*len*0.5;
  x.strokeStyle = col; x.lineWidth = w; x.lineCap='round';
  x.beginPath(); x.moveTo(x0,y0); x.quadraticCurveTo(mx,my,x1,y1); x.stroke();
  const forks = depth > 1 ? 2 : (rng()<0.6?2:1);
  for(let i=0;i<forks;i++){
    const spread = (i - (forks-1)/2) * (0.55 + rng()*0.5);
    limb(x, x1,y1, ang+spread+(rng()-0.5)*0.3, len*(0.58+rng()*0.16),
         Math.max(0.7, w*0.62), depth-1, rng, col);
  }
}

/* ---------------------------------------------------------------- paper */
let PAPER = null, GRAIN = null;
function bakePaper(){
  /* A tileable sheet. Deliberately HIGH-FREQUENCY ONLY: the first pass laid
     broad radial tonal drifts into the tile, and at 256px they read as an
     obvious repeating quilt the moment the camera moved. Big tonal variation
     belongs in the per-frame gradients and the world-space foxing blots, which
     do not tile. */
  const S = 384;
  const {c,x} = offscreen(S,S);
  const rng = mulberry32(0x5EED);
  x.fillStyle = PARCH; x.fillRect(0,0,S,S);
  // fibres — short strokes in two directions, wrapped so the tile seams hide
  // short and faint: longer, darker fibres read as scratches or stray hairs
  for(let i=0;i<2600;i++){
    const fx = rng()*S, fy = rng()*S;
    const a = (rng()<0.5?0:Math.PI/2) + (rng()-0.5)*0.7;
    const l = 1.5 + rng()*4.5;
    x.strokeStyle = rng()<0.5 ? 'rgba(150,124,80,0.045)' : 'rgba(252,246,228,0.085)';
    x.lineWidth = 0.4 + rng()*0.5;
    for(const [ox,oy] of [[0,0],[S,0],[-S,0],[0,S],[0,-S]]){
      x.beginPath();
      x.moveTo(fx+ox, fy+oy);
      x.lineTo(fx+ox+Math.cos(a)*l, fy+oy+Math.sin(a)*l);
      x.stroke();
    }
  }
  // flecks of pulp
  for(let i=0;i<420;i++){
    x.fillStyle = rng()<0.6 ? 'rgba(120,96,58,0.12)' : 'rgba(70,54,32,0.09)';
    const r = 0.4+rng()*1.3;
    x.beginPath(); x.arc(rng()*S, rng()*S, r, 0, TAU); x.fill();
  }
  PAPER = ctx.createPattern(c, 'repeat');

  // a separate high-frequency grain laid over the whole screen at the end
  const {c:c2, x:x2} = offscreen(S,S);
  const r2 = mulberry32(0xC0FFEE);
  for(let i=0;i<5200;i++){
    x2.fillStyle = r2()<0.5 ? 'rgba(60,44,24,0.05)' : 'rgba(255,250,235,0.05)';
    x2.fillRect(r2()*S, r2()*S, 1, 1);
  }
  GRAIN = ctx.createPattern(c2, 'repeat');
}

/* -------------------------------------------------------------- creatures */
const SPR = {};
const FRAMES = 4;

/* NOTE ON SHADING. These read at ~26px tall in a crowd of hundreds, so the
   silhouette carries everything and interior detail is nearly free to lose.
   Hatching is deliberately kept to a narrow band on ONE flank at low alpha:
   the first pass shaded 60% of every body and turned the horde into pale
   striped mush with no read at all. Ink first, carving second. */
function bakeHusk(seedBase, tint){
  // A hunched bark-thing: heavy drooping torso, branch arms, no face.
  const out = [];
  for(let f=0; f<FRAMES; f++){
    const W=46, Hh=56, o = offscreen(W,Hh), x = o.x;
    const rng = mulberry32(seedBase + f*977);
    const sway = Math.sin(f/FRAMES*TAU)*2.2;
    const lift = Math.abs(Math.cos(f/FRAMES*TAU))*1.6;
    const cx = W/2, cy = Hh*0.58 - lift;
    const solid = tint || INK;

    // legs first, behind the body
    x.strokeStyle = solid; x.lineWidth = 3.4; x.lineCap='round';
    for(const s of [-1,1]){
      const step = Math.sin(f/FRAMES*TAU + (s>0?0:Math.PI))*3.4;
      x.beginPath(); x.moveTo(cx+s*3.4, cy+10);
      x.quadraticCurveTo(cx+s*5.5, cy+16, cx+s*4.6+step, cy+22);
      x.stroke();
    }
    // branch arms — the thing that makes it read as grown, not drawn
    for(const s of [-1,1]){
      const swing = Math.sin(f/FRAMES*TAU + (s>0?Math.PI:0))*0.30;
      limb(x, cx+s*8, cy-4, (s>0? 0.62 : Math.PI-0.62) + swing, 10, 2.9, 2,
           mulberry32(seedBase+f*13+(s>0?7:19)), solid);
    }
    // torso — a leaning teardrop, solid
    const pts = ellipsePts(cx+sway*0.4, cy, 11.5, 14.5, 13, 0.82)
      .map(([px,py]) => [px + (py<cy? sway*0.5 : 0), py]);
    roughShape(x, pts, 1.6, rng);
    x.fillStyle = solid; x.fill();
    // A narrow band of carving down the trailing flank ONLY. hatch() strokes
    // across the whole clip region, so the band has to be clipped by a rect as
    // well as the body — otherwise the lines wrap the torso and it reads as
    // bandaging rather than shading.
    x.save();
    roughShape(x, pts, 1.6, mulberry32(seedBase+f*977)); x.clip();
    x.beginPath(); x.rect(cx-13, cy-9, 7.5, 24); x.clip();
    hatch(x, cx-9, cy+2, cx-6, cy+12, -0.42, 3.6, 1.0, PARCH, 0.30,
          mulberry32(seedBase+31), true);
    x.restore();
    // head: drooping forward, solid — a pale face made them read as skulls
    const hx = cx + sway*0.8 + 1.6, hy = cy - 15;
    roughShape(x, ellipsePts(hx, hy, 6.8, 6.0, 10), 1.1, rng);
    x.fillStyle = solid; x.fill();
    // one carved notch under the brow: enough to imply a face, not draw one
    x.strokeStyle = PARCH; x.globalAlpha = 0.42; x.lineWidth = 1.3;
    x.beginPath(); x.moveTo(hx-3.2, hy+1.2); x.lineTo(hx+2.6, hy+2.0); x.stroke();
    x.globalAlpha = 1;
    if(tint){  // revenants get a single wet glint so they pop out of the crowd
      x.fillStyle = GOLD2;
      x.beginPath(); x.arc(hx+1.2, hy-0.6, 1.15, 0, TAU); x.fill();
    }
    out.push(o.c);
  }
  return out;
}

function bakeCreeper(seedBase){
  // Low and many-legged. Reads instantly as "faster than the big ones."
  const out = [];
  for(let f=0; f<FRAMES; f++){
    const W=42, Hh=34, o = offscreen(W,Hh), x = o.x;
    const rng = mulberry32(seedBase + f*613);
    const cx = W/2, cy = Hh*0.55;
    x.strokeStyle = INK; x.lineCap='round';
    for(const s of [-1,1]){
      for(let i=0;i<3;i++){
        const ph = f/FRAMES*TAU + i*1.1 + (s>0?0:Math.PI);
        const kick = Math.sin(ph)*3.6;
        const ax = cx + s*4 + (i-1)*3.2;
        x.lineWidth = 1.7;
        x.beginPath(); x.moveTo(ax, cy+1);
        x.quadraticCurveTo(ax+s*7, cy+2+kick*0.4, ax+s*9.5, cy+8+kick*0.5);
        x.stroke();
      }
    }
    // flattened carapace wedge
    const pts = [[cx,cy-9.5],[cx+11,cy-1],[cx+8.5,cy+5.5],[cx,cy+7.4],[cx-8.5,cy+5.5],[cx-11,cy-1]];
    roughShape(x, pts, 1.2, rng);
    x.fillStyle = INK; x.fill();
    x.save();
    roughShape(x, pts, 1.2, mulberry32(seedBase+f*613)); x.clip();
    x.beginPath(); x.rect(cx+2, cy-8, 10, 15); x.clip();
    hatch(x, cx+5, cy-2, cx+9, cy+4, 0.9, 3.4, 0.95, PARCH, 0.26,
          mulberry32(seedBase+91), true);
    x.restore();
    // one carved chevron so the front end is legible at speed
    x.strokeStyle = PARCH; x.lineWidth = 1.3; x.globalAlpha=0.5;
    x.beginPath(); x.moveTo(cx-3.4, cy-3.6); x.lineTo(cx, cy-6.2); x.lineTo(cx+3.4, cy-3.6);
    x.stroke(); x.globalAlpha=1;
    out.push(o.c);
  }
  return out;
}

function bakeBloat(seedBase){
  // A swollen fruit-body, split along a seam. Slow, heavy, worth avoiding.
  const out = [];
  for(let f=0; f<FRAMES; f++){
    const W=62, Hh=62, o = offscreen(W,Hh), x = o.x;
    const rng = mulberry32(seedBase + f*449);
    const cx = W/2, cy = Hh*0.55;
    const pulse = 1 + Math.sin(f/FRAMES*TAU)*0.045;
    x.strokeStyle = INK; x.lineWidth = 3; x.lineCap='round';
    for(const s of [-1,1]){
      x.beginPath(); x.moveTo(cx+s*7, cy+14);
      x.quadraticCurveTo(cx+s*10, cy+19, cx+s*8, cy+24); x.stroke();
    }
    const pts = ellipsePts(cx, cy, 19*pulse, 18*pulse, 15);
    roughShape(x, pts, 2.0, rng);
    x.fillStyle = INK; x.fill();
    x.save(); roughShape(x, pts, 2.0, mulberry32(seedBase+f*449)); x.clip();
    // two carved rings imply the swell; more than that fills it in
    x.strokeStyle = PARCH; x.globalAlpha = 0.30;
    for(let i=1;i<=2;i++){
      x.lineWidth = 1.4 - i*0.25;
      x.beginPath(); x.arc(cx-2, cy-1, 6.5*i*pulse, 0.55, 2.45); x.stroke();
    }
    x.globalAlpha = 1;
    x.save();
    x.beginPath(); x.rect(cx-21, cy+4, 15, 18); x.clip();
    hatch(x, cx-15, cy+11, cx-9, cy+17, -0.6, 4.0, 1.05, PARCH, 0.24,
          mulberry32(seedBase+77), true);
    x.restore();
    // the seam — the one bright mark, so it reads as split and ripe
    x.strokeStyle = PARCH; x.lineWidth = 2.0; x.globalAlpha = 0.55;
    x.beginPath();
    x.moveTo(cx+1, cy-17*pulse);
    x.quadraticCurveTo(cx-4, cy, cx+2, cy+16*pulse);
    x.stroke(); x.globalAlpha = 1;
    x.restore();
    out.push(o.c);
  }
  return out;
}

function bakeSkeleton(){
  const out = [];
  for(let f=0; f<2; f++){
    const W=30, Hh=38, o = offscreen(W,Hh), x = o.x;
    const cx = W/2, cy = Hh*0.55;
    const sway = f? 1.2 : -1.2;
    x.strokeStyle = BLUEIN; x.fillStyle = PARCH4;
    x.lineWidth = 2.0; x.lineCap='round';
    // legs
    for(const s of [-1,1]){ x.beginPath(); x.moveTo(cx+s*1.6, cy+6);
      x.lineTo(cx+s*3.4+(s>0?sway:-sway), cy+13); x.stroke(); }
    // spine + ribs
    x.beginPath(); x.moveTo(cx+sway*0.3, cy-4); x.lineTo(cx, cy+6); x.stroke();
    for(let i=0;i<3;i++){
      const ry = cy-2+i*3.1, rw = 5.2-i*0.9;
      x.beginPath(); x.moveTo(cx-rw, ry); x.quadraticCurveTo(cx, ry+1.6, cx+rw, ry); x.stroke();
    }
    // arms
    for(const s of [-1,1]){ x.beginPath(); x.moveTo(cx+s*2, cy-3);
      x.lineTo(cx+s*7, cy+3-(s>0?sway:0)); x.stroke(); }
    // skull
    x.beginPath(); x.arc(cx+sway*0.4, cy-8.5, 4.6, 0, TAU); x.fill(); x.stroke();
    x.fillStyle = BLUEIN;
    x.beginPath(); x.arc(cx+sway*0.4-1.7, cy-9, 1.25, 0, TAU); x.fill();
    x.beginPath(); x.arc(cx+sway*0.4+1.7, cy-9, 1.25, 0, TAU); x.fill();
    out.push(o.c);
  }
  return out;
}

function bakeTrees(){
  // Blighted orchard trees: gnarled trunk, forked crown, a few clinging fruits.
  const out = [];
  for(let v=0; v<5; v++){
    const W=120, Hh=140, o = offscreen(W,Hh), x = o.x;
    const rng = mulberry32(0xA11CE + v*7919);
    const bx = W/2, by = Hh-14;
    // trunk: a tapered rough column with a slight lean
    const lean = (rng()-0.5)*16;
    const th = 54 + rng()*22;
    const trunk = [
      [bx-7, by],[bx-4+lean*0.4, by-th*0.55],[bx-3.4+lean, by-th],
      [bx+3.4+lean, by-th],[bx+4+lean*0.4, by-th*0.55],[bx+7, by]
    ];
    roughShape(x, trunk, 2.0, rng);
    x.fillStyle = INK; x.fill();
    // bark carved into the trunk
    x.save(); roughShape(x, trunk, 2.0, mulberry32(0xA11CE+v*7919)); x.clip();
    hatch(x, bx-10, by-th, bx+10, by, 1.45, 3.0, 1.1, PARCH, 0.42,
          mulberry32(v*131+5), true);
    x.restore();
    // crown
    const branches = 3 + (rng()*3|0);
    for(let i=0;i<branches;i++){
      const a = -Math.PI/2 + (i-(branches-1)/2)*(0.42+rng()*0.16) + (rng()-0.5)*0.2;
      limb(x, bx+lean, by-th+2, a, 20+rng()*12, 3.4, 3, mulberry32(v*577+i*89), INK);
    }
    // a couple of blighted fruits still hanging
    const fruits = rng()*3|0;
    for(let i=0;i<fruits;i++){
      const fx2 = bx+lean+(rng()-0.5)*44, fy2 = by-th-8-rng()*26;
      x.fillStyle = RUBRIC; x.globalAlpha = 0.75;
      x.beginPath(); x.arc(fx2, fy2, 2.4+rng()*1.4, 0, TAU); x.fill();
      x.globalAlpha = 1;
    }
    out.push(o.c);
  }
  return out;
}

function bakeWarden(){
  // The Orchard-Warden: the orchard itself, stood up and walking.
  const S = 260, o = offscreen(S,S), x = o.x;
  const rng = mulberry32(0xBEA57);
  const cx = S/2, cy = S/2;
  // root legs
  for(const s of [-1,1]){
    limb(x, cx+s*16, cy+34, (s>0?0.75:Math.PI-0.75), 30, 9, 3, mulberry32(0x1001+(s>0?3:9)), INK);
  }
  // trunk-body
  const body = ellipsePts(cx, cy, 50, 58, 17, 0.9);
  roughShape(x, body, 4.5, rng);
  x.fillStyle = INK; x.fill();
  x.save(); roughShape(x, body, 4.5, mulberry32(0xBEA57)); x.clip();
  // Coarse, uneven bark grain — the earlier fine cross-hatch turned the body
  // into a flat screen-door mesh. One direction only, heavy and varied.
  const bg = mulberry32(11);
  x.strokeStyle = PARCH; x.lineCap = 'round';
  for(let i=0;i<16;i++){
    const gx = cx - 46 + i*6.2 + (bg()-0.5)*3;
    x.globalAlpha = 0.16 + bg()*0.22;
    x.lineWidth = 1.1 + bg()*2.4;
    x.beginPath();
    x.moveTo(gx, cy-60);
    x.quadraticCurveTo(gx + (bg()-0.5)*13, cy, gx + (bg()-0.5)*9, cy+60);
    x.stroke();
  }
  // a few knots
  x.globalAlpha = 0.30;
  for(let i=0;i<4;i++){
    const kx = cx-34+bg()*66, ky = cy-34+bg()*70;
    x.lineWidth = 1.4;
    x.beginPath(); x.ellipse(kx, ky, 3+bg()*4, 1.6+bg()*2, bg()*3, 0, TAU); x.stroke();
  }
  x.globalAlpha = 1;
  x.restore();
  // the hollow: a carved knot-face, the only bright thing on it
  x.fillStyle = PARCH;
  roughShape(x, ellipsePts(cx-2, cy-14, 15, 19, 11), 2.2, mulberry32(77));
  x.fill();
  x.fillStyle = INK;
  roughShape(x, ellipsePts(cx-2, cy-12, 9.5, 13, 10), 1.8, mulberry32(78));
  x.fill();
  x.fillStyle = RUBRIC;
  x.beginPath(); x.arc(cx-6, cy-15, 2.6, 0, TAU); x.fill();
  x.beginPath(); x.arc(cx+3, cy-14, 2.6, 0, TAU); x.fill();
  // crown of branches
  for(let i=0;i<9;i++){
    const a = -Math.PI/2 + (i-4)*0.36 + (rng()-0.5)*0.12;
    limb(x, cx+(i-4)*4, cy-52, a, 30+rng()*20, 5.2, 3, mulberry32(0x2002+i*37), INK);
  }
  return o.c;
}

function bakeScribe(){
  // Hooded scribe, four walk frames, robe hatched like an engraving.
  const out = [];
  for(let f=0; f<FRAMES; f++){
    const W=44, Hh=52, o = offscreen(W,Hh), x = o.x;
    const rng = mulberry32(0x5C41BE + f*331);
    const cx = W/2, cy = Hh*0.58;
    const step = Math.sin(f/FRAMES*TAU);
    const lift = Math.abs(Math.cos(f/FRAMES*TAU))*1.4;
    // feet
    x.strokeStyle = INK; x.lineWidth = 2.6; x.lineCap='round';
    for(const s of [-1,1]){
      const k = step*(s>0?1:-1)*2.6;
      x.beginPath(); x.moveTo(cx+s*2.6, cy+8-lift);
      x.lineTo(cx+s*3.6+k, cy+14-lift); x.stroke();
    }
    // robe — a bell that flares with the stride
    const robe = [
      [cx, cy-14-lift],[cx+8.5, cy-4-lift],[cx+10.5+step*1.4, cy+10-lift],
      [cx, cy+12.5-lift],[cx-10.5+step*1.4, cy+10-lift],[cx-8.5, cy-4-lift]
    ];
    roughShape(x, robe, 1.4, rng);
    x.fillStyle = INK; x.fill();
    x.save(); roughShape(x, robe, 1.4, mulberry32(0x5C41BE+f*331)); x.clip();
    // two fold lines only — five turned the robe into a striped ghost
    x.strokeStyle = PARCH; x.globalAlpha = 0.30; x.lineWidth = 1.1;
    for(const i of [-1.2, 0.9]){
      x.beginPath();
      x.moveTo(cx+i*3.1, cy-9-lift);
      x.quadraticCurveTo(cx+i*3.8+step*0.8, cy, cx+i*4.6+step*1.4, cy+11-lift);
      x.stroke();
    }
    x.globalAlpha = 1; x.restore();
    // hood
    roughShape(x, ellipsePts(cx, cy-16-lift, 7.0, 7.6, 11, 0.85), 1.0, rng);
    x.fillStyle = INK; x.fill();
    // one rubric glint under the hood — the scribe's only colour
    x.fillStyle = RUBRIC;
    x.beginPath(); x.arc(cx+1.4, cy-15-lift, 1.35, 0, TAU); x.fill();
    out.push(o.c);
  }
  return out;
}

/* the three implements, drawn as real objects in the scribe's hand */
function bakeImplements(){
  const mk = (w,h,fn) => { const o = offscreen(w,h); fn(o.x, w, h); return o.c; };
  return {
    greatsword: mk(46,14,(x,w,h)=>{
      const y=h/2;
      x.fillStyle=INK;
      x.beginPath(); x.moveTo(9,y-3.1); x.lineTo(41,y-1.5); x.lineTo(44,y);
      x.lineTo(41,y+1.5); x.lineTo(9,y+3.1); x.closePath(); x.fill();
      x.strokeStyle=PARCH; x.globalAlpha=.55; x.lineWidth=.9;
      x.beginPath(); x.moveTo(11,y); x.lineTo(40,y); x.stroke(); x.globalAlpha=1;
      x.strokeStyle=INK; x.lineWidth=3.4; x.beginPath(); x.moveTo(8,y-5); x.lineTo(8,y+5); x.stroke();
      x.lineWidth=2.6; x.beginPath(); x.moveTo(1,y); x.lineTo(8,y); x.stroke();
    }),
    censer: mk(34,20,(x,w,h)=>{
      const y=h/2;
      x.strokeStyle=INK; x.lineWidth=1.2;
      x.beginPath(); x.moveTo(2,y-4); x.quadraticCurveTo(14,y-8,24,y-3); x.stroke();
      x.fillStyle=INK;
      x.beginPath(); x.moveTo(19,y-3); x.lineTo(30,y-3); x.lineTo(27,y+7); x.lineTo(22,y+7);
      x.closePath(); x.fill();
      x.strokeStyle=PARCH; x.globalAlpha=.6; x.lineWidth=1;
      x.beginPath(); x.moveTo(21,y+1); x.lineTo(28,y+1); x.stroke(); x.globalAlpha=1;
      x.fillStyle=RUBRIC;
      x.beginPath(); x.arc(24.5,y+3.5,1.7,0,TAU); x.fill();
    }),
    longbow: mk(30,40,(x,w,h)=>{
      const cx2=w*0.42, cy2=h/2;
      x.strokeStyle=INK; x.lineWidth=2.6; x.lineCap='round';
      x.beginPath(); x.arc(cx2-4, cy2, 15, -1.15, 1.15); x.stroke();
      x.lineWidth=0.9; x.globalAlpha=.85;
      x.beginPath();
      x.moveTo(cx2-4+Math.cos(-1.15)*15, cy2+Math.sin(-1.15)*15);
      x.lineTo(cx2-9, cy2);
      x.lineTo(cx2-4+Math.cos(1.15)*15, cy2+Math.sin(1.15)*15);
      x.stroke(); x.globalAlpha=1;
    }),
  };
}

/* Hit flash. Compositing this at draw time with 'source-atop' was a bug: the
   operation applies to the whole canvas, so filling the sprite's bounding box
   whitewashed a RECTANGLE of the scene behind it. Baking a parchment-filled
   silhouette per frame is both correct (the source canvas is transparent
   outside the shape) and free at runtime. */
const SPRF = {};
function flashify(cv){
  const o = document.createElement('canvas');
  o.width = cv.width; o.height = cv.height;
  const x = o.getContext('2d');
  x.drawImage(cv, 0, 0);
  x.globalCompositeOperation = 'source-atop';
  x.fillStyle = PARCH4;
  x.fillRect(0, 0, o.width, o.height);
  return o;
}
function carveVariant(frames,kind){
  return frames.map(img=>{
    const W=img.width/SS,Hh=img.height/SS,o=offscreen(W,Hh),x=o.x,cx=W/2,cy=Hh*0.58;
    x.drawImage(img,0,0,W,Hh);x.strokeStyle=INK;x.fillStyle=INK;x.lineCap='round';
    if(kind==='rootling'){x.lineWidth=2;for(const s of [-1,1]){x.beginPath();x.moveTo(cx+s*5,cy+5);x.lineTo(cx+s*14,cy+12);x.lineTo(cx+s*18,cy+8);x.stroke();}}
    else if(kind==='needlekin'){x.lineWidth=2.5;for(let i=-2;i<=2;i++){x.beginPath();x.moveTo(cx+i*3,cy-13);x.lineTo(cx+i*5,cy-25-Math.abs(i)*2);x.stroke();}}
    else if(kind==='bellower'){x.strokeStyle=GOLD;x.lineWidth=2;x.beginPath();x.arc(cx,cy,16,0,TAU);x.stroke();x.fillStyle=INK;x.fillRect(cx-7,cy-2,14,12);}
    else if(kind==='inkspitter'){x.strokeStyle=RUBRIC;x.lineWidth=2;for(let i=-2;i<=2;i++){x.beginPath();x.moveTo(cx+i*2,cy-8);x.lineTo(cx+i*5,cy-25);x.stroke();}}
    else if(kind==='broodpod'){x.strokeStyle=VERD;x.lineWidth=2;x.beginPath();x.moveTo(cx-8,cy-12);x.lineTo(cx,cy-3);x.lineTo(cx-6,cy+8);x.moveTo(cx,cy-3);x.lineTo(cx+9,cy+5);x.stroke();}
    else if(kind==='stumpguard'){x.lineWidth=6;x.beginPath();x.moveTo(cx-18,cy-8);x.lineTo(cx-21,cy+14);x.moveTo(cx+18,cy-8);x.lineTo(cx+21,cy+14);x.stroke();}
    return o.c;
  });
}

  SPR.rootling = carveVariant(bakeCreeper(0x7155),'rootling');
  SPR.needlekin= carveVariant(bakeHusk(0xA11CE, null),'needlekin');
  SPR.bellower = carveVariant(bakeBloat(0xBE115),'bellower');

  SPR.broodpod = carveVariant(bakeBloat(0xB00D),'broodpod');

}

  implement:['Edge','Reliquary','Limb','Instrument','Argument'],
  mantle:['Mantle','Shroud','Cope','Vestment'],
  bracers:['Bracers','Vambrace','Wraps','Cuffs'],
  talisman:['Talisman','Sigil','Charm','Reliquary'],
};

function makeItem(slot, rarity, kwBias, baseKey){
  const r = RARITY[clamp(rarity,0,3)];
  const it = {
    uid: uid(), slot, rarity: r.n,
    base: slot === 'implement' ? (baseKey || pick(IMPL_KEYS)) : null,
    power: 1 + r.n*0.22 + rand(0.14),
    affixes: [],
  };
  if(slot==='implement') it.skill = DEFAULT_SKILL_BY_IMPLEMENT[it.base] || null;
  const pool = AFFIX_IDS.slice();
  for(let i=0;i<r.affixes;i++){
    let choices = pool;
    // bias: first affix (and ~half of the rest) honours the requested keyword
    if(kwBias && (i===0 || Math.random()<0.55)){
      const biased = affixesByKw(kwBias).filter(a => pool.includes(a));
      if(biased.length) choices = biased;
    }
    const a = pick(choices);
    it.affixes.push(a);
    pool.splice(pool.indexOf(a),1);
  }
  it.name = itemName(it);
  return it;
}
function itemName(it){
  if(it.slot === 'implement') {
    const kw = it.affixes.map(a=>AFFIXES[a].kw).find(Boolean);
    const pre = kw ? {grave:'Bound',ember:'Cindered',oath:'Vigil'}[kw] : pick(PREFIX);
    return pre + ' ' + IMPLEMENTS[it.base].name;
  }
  return pick(PREFIX) + ' ' + pick(NOUN[it.slot]);
}
function itemHas(it,a){ return it && it.affixes.indexOf(a) >= 0; }

const SAVE_KEY = 'vellum_save_v1';
const PREFERS_REDUCED_MOTION=!!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
function blankSave(){
  const start = makeItem('implement',0,null,'greatsword');
  return {
    mats:{cinder:0,graveash:0,gilt:0,heartwood:0},
    stash:[],
    loadout:{implement:start, mantle:null, bracers:null, talisman:null},
    runs:0, wins:0, best:0, townSeen:false, tutorialDone:false,
    seen:{},          // bestiary pages ever inscribed
    seenEnemies:{},
    settings:{sound:true,shake:!PREFERS_REDUCED_MOTION,particles:true,contrast:false,threatCues:true},
  };
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return blankSave();
    const s = JSON.parse(raw);
    if(!s || !s.loadout) return blankSave();
    if(!s.mats)s.mats={};
    if(!Array.isArray(s.stash))s.stash=[];
    for(const k of MAT_IDS) if(typeof s.mats[k] !== 'number') s.mats[k]=0;
    if(!s.seen) s.seen = {};
    if(!s.seenEnemies)s.seenEnemies={};
    if(typeof s.tutorialDone!=='boolean') s.tutorialDone=false;
    s.settings=Object.assign({sound:true,shake:!PREFERS_REDUCED_MOTION,particles:true,contrast:false,threatCues:true},s.settings||{});
    // keep uid counter ahead of anything loaded
    const all = s.stash.concat(SLOTS.map(x=>s.loadout[x]).filter(Boolean));
    for(const it of all){
      if(it && it.uid >= _uid) _uid = it.uid+1;
      // v1 migration: weapon skills are saved on the individual implement.
      if(it?.slot==='implement' && (it.skill===undefined||it.skill===null)) it.skill=DEFAULT_SKILL_BY_IMPLEMENT[it.base]||null;
    }
    return s;
  }catch(e){ return blankSave(); }
}

/* ================================================================ AUDIO
   A tiny procedural score: dry paper, wooden platen, rubric bell. No samples,
   no download, and nothing starts until the player deliberately interacts. */
let AC=null, master=null, noiseBuffer=null, lastHitSound=0, ambienceClock=0,soundGate={};
function audioReady(){
  if(!SV.settings.sound)return null;
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.28;master.connect(AC.destination);
    noiseBuffer=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate);
    const d=noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  }
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(freq,dur=.08,type='sine',gain=.12,slide=1,delay=0){
  const ac=audioReady();if(!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(25,freq*slide),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
function noise(dur=.06,gain=.08,cut=1300,delay=0){
  const ac=audioReady();if(!ac)return;const t=ac.currentTime+delay,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuffer;f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.02);
}
function sfx(id,power=1){
  if(!SV.settings.sound)return;
  const waits={bell:650,quill:160,pod:180,platen:500,marginTell:500,seedTell:500},now=performance.now();if(waits[id]&&now-(soundGate[id]||0)<waits[id])return;if(waits[id])soundGate[id]=now;
  if(id==='sweep'){noise(.055,.05*power,900);tone(105,.07,'triangle',.045*power,.62);}
  else if(id==='shot'){noise(.035,.035*power,2600);tone(390,.045,'triangle',.025*power,1.6);}
  else if(id==='lob'){tone(150,.12,'sine',.045*power,.62);noise(.05,.025*power,700,.06);}
  else if(id==='impact'){noise(.13,.11*power,520);tone(58,.16,'triangle',.07*power,.62);}
  else if(id==='hit'){const now=performance.now();if(now-lastHitSound<42)return;lastHitSound=now;noise(.045,.055*power,1100);}
  else if(id==='kill'){tone(92,.07,'square',.025*power,.55);}
  else if(id==='bell'){tone(196,.18,'triangle',.045,1.25);tone(294,.22,'triangle',.035,.88,.09);}
  else if(id==='quill'){noise(.13,.05,3200);tone(760,.08,'triangle',.022,.62);}
  else if(id==='pod'){noise(.18,.09,620);tone(82,.18,'square',.035,.58);}
  else if(id==='platen'){tone(68,.28,'square',.055,.58);noise(.1,.055,420,.08);}
  else if(id==='marginTell'){tone(330,.18,'sawtooth',.04,1.8);noise(.07,.025,2600,.06);}
  else if(id==='seedTell'){tone(118,.22,'triangle',.045,.72);tone(88,.3,'sine',.035,.8,.1);}
  else if(id==='hurt'){noise(.12,.12,500);tone(74,.16,'sawtooth',.09,.55);}
  else if(id==='pickup'){tone(520,.07,'sine',.04,1.35);}
  else if(id==='page'){tone(330,.12,'triangle',.06,1.5);tone(495,.16,'triangle',.045,1.25,.08);}
  else if(id==='skill'){noise(.16,.13,1700);tone(135,.25,'sawtooth',.08,2.1);}
  else if(id==='boss'){tone(48,.8,'sawtooth',.12,.72);tone(71,.7,'triangle',.08,.68,.12);}
  else if(id==='phase'){tone(62,.55,'sawtooth',.12,1.8);noise(.32,.12,600);}
  else if(id==='victory'){[262,330,392,523].forEach((f,i)=>tone(f,.42,'triangle',.07,1,i*.13));}
  else if(id==='dead'){[147,117,87].forEach((f,i)=>tone(f,.36,'triangle',.07,.72,i*.14));}
  else if(id==='ui'){tone(410,.045,'triangle',.025,1.08);}
  else if(id==='turn'){noise(.18,.07,1500);tone(118,.12,'triangle',.025,.78,.05);}
}
function audioAmbience(dt){
  if(!AC||!SV.settings.sound||G.mode!=='run')return;ambienceClock-=dt;if(ambienceClock>0)return;
  ambienceClock=G.boss?2.2:rand(7,4);noise(G.boss?.18:.09,G.boss?.025:.012,G.boss?280:850);if(G.boss)tone(42,.55,'sine',.025,.9);

function makePlayer(){
  const p = {
    x:0, y:0, vx:0, vy:0, r:13,
    hp:100, maxhp:100, speed:186,
    level:1, xp:0, xpNext:8,
    face:0, hurtT:0, wardT:0, ward:false,
    hitStreak:0, burnOn:false,
    atkRate:1, pickup:92, xpMul:1,

  };
  return p;
}

/* Derived stats live in one place so gear/cards/doctrines never fight. */
function recompute(){
  const p = G.player; if(!p) return;
  const L = SV.loadout;
  G.doct = computeDoctrines(L);

  // base
  let maxhp = 100, rate = 1, reach = 1, pickup = 92, xpMul = 1, speed = 186;

  // implicit slot contributions (small — the affixes are the stars)
  if(L.mantle)   maxhp  += Math.round(18 * L.mantle.power);
  if(L.bracers)  rate   += 0.10 * L.bracers.power;
  if(L.talisman){ pickup += 30 * L.talisman.power; xpMul += 0.12 * L.talisman.power; }

  // affixes that touch derived numbers
  if(hasAffix('quickening')) rate  += 0.18;
  if(hasAffix('longreach'))  reach += 0.25;

  // cards
  for(const c of G.cards){
    if(c.id === 'thornwrit')   rate  += 0.25;
    if(c.id === 'oathmark')    speed += 0;
    if(c.id === 'swarmscript'){ pickup += 90; xpMul += 0.30; }
    if(c.id === 'ironbark')     maxhp += 30;
    if(c.id === 'rootledger')   speed += 19;
  }

  const prevMax = p.maxhp;
  p.maxhp = maxhp; p.atkRate = rate; p.reach = reach;
  p.pickup = pickup; p.xpMul = xpMul; p.speed = speed;
  if(p.maxhp > prevMax) p.hp += (p.maxhp - prevMax);
  p.hp = clamp(p.hp, 0, p.maxhp);
  p.burnOn = hasAffix('cinderkiss') || !!G.traits.ember;
}
function hasAffix(a){
  for(const s of SLOTS){ const it = SV.loadout[s]; if(it && it.affixes.indexOf(a)>=0) return true; }
  return false;
}
function implement(){
  const it = SV.loadout.implement;
  return it ? IMPLEMENTS[it.base] : IMPLEMENTS.greatsword;
}
function implPower(){ const it = SV.loadout.implement; return it ? it.power : 1; }

function buildOrchard(){
  G.trees.length = 0; G.blots.length = 0; G.walls.length = 0; G.landmarks.length=0;
  const reserved=[[-920,-180],[760,-720],[-520,880],[940,690],[-1180,720],[0,-1380]];
  for(let i=0;i<210;i++){
    const a = rand(TAU), d = 260 + Math.sqrt(Math.random())*(WORLD-320);
    G.trees.push({ x:Math.cos(a)*d, y:Math.sin(a)*d, s: rand(1.15,0.62),
                   v: randi(5), flip: Math.random()<0.5 });
  }
  G.trees.sort((a,b)=>a.y-b.y);   // painter's order, fixed once
  G.trees=G.trees.filter(t=>reserved.every(([x,y])=>dist2(t.x,t.y,x,y)>145*145));
  for(let i=0;i<60;i++){
    G.blots.push({ x:rand(WORLD*2,-WORLD), y:rand(WORLD*2,-WORLD), r:rand(90,26), a:rand(0.055,0.015) });
  }
  // Purposeful cover: fallen trunks, root shelves and collapsed type. Placement
  // rejects intersections so the field never produces accidental Tetris glyphs.
  let tries=0;
  while(G.walls.length<18&&tries++<300){
    const a=rand(TAU),d=rand(WORLD-320,470),long=rand(220,120),thick=rand(34,22),vertical=Math.random()<0.5;
    const x=Math.cos(a)*d,y=Math.sin(a)*d;
    if(G.walls.some(o=>Math.hypot(o.x-x,o.y-y)<Math.max(long,o.w,o.h)+95))continue;
    if(reserved.some(([rx,ry])=>dist2(x,y,rx,ry)<190*190))continue;
    const kind=pick(['trunk','trunk','roots','type']);
    G.walls.push({x,y,w:vertical?thick:long,h:vertical?long:thick,kind,hp:kind==='type'?90:999,maxhp:kind==='type'?90:999,seed:randi(9999)});
  }
  G.landmarks.push(
    {kind:'press',x:-920,y:-180,name:'THE BROKEN PRESS',cd:0},
    {kind:'folio',x:760,y:-720,name:'THE HANGING FOLIO'},
    {kind:'well',x:-520,y:880,name:'THE BLACK WELL',charge:0},
    {kind:'camp',x:940,y:690,name:'THE LAST DESK',used:false},
    {kind:'nest',x:-1180,y:720,name:'THE ROOT BROOD',opened:false},
    {kind:'effigy',x:0,y:-1380,name:'THE WARDEN EFFIGY'}
  );
  for(let i=0;i<G.landmarks.length;i++){
    const L=G.landmarks[i],a=Math.atan2(L.y,L.x),n=-Math.sin(a),m=Math.cos(a);
    L.marks=[{x:L.x*.56+n*(i%2?32:-26),y:L.y*.56+m*(i%2?32:-26),a,cut:i%3}];
  }
}
function regionAt(x,y){
  if(Math.hypot(x,y)<520)return 'THE RULED GROVE';
  if(y<-900)return 'THE WARDEN\'S CLEARING';
  if(x<-260&&y<360)return 'THE BROKEN PRESS';
  if(y>360&&x<180)return 'THE BLOTTED HOLLOW';
  if(x>180)return 'THE RED MARGIN';

}

/* ============================================================ SPAWNING */
/* Speeds are set as a FRACTION OF PLAYER SPEED (186), not in isolation. At the
   first pass husks moved at 44 — under a quarter of the player — so a moving
   player simply outran the entire zone and never had to fight. The horde only
   creates pressure if it closes when you turn. */
const ENEMY_KINDS = {
  husk:    {hp:24,  spd:104, r:12, dmg:9,  xp:1, col:INK,  w:0.62},  // ~56% — closes if you stop
  creeper: {hp:16,  spd:158, r:10, dmg:7,  xp:1, col:INK2, w:0.26},  // ~85% — genuinely chases
  bloat:   {hp:88,  spd:62,  r:19, dmg:15, xp:4, col:INK,  w:0.12},  // ~33% — a body to path around
  rootling:{hp:11,  spd:174, r:7,  dmg:5,  xp:1, col:VERD, w:0},     // arrives in knots and slips through gaps
  needlekin:{hp:34,spd:92,  r:13, dmg:10, xp:2, col:INK2, w:0},     // lunges from the edge of the crush
  bellower:{hp:58, spd:76,  r:17, dmg:11, xp:3, col:GOLD, w:0},     // periodically hastes its neighbours
  inkspitter:{hp:28,spd:82, r:12, dmg:8,  xp:2, col:RUBRIC,w:0},    // holds range and fires a telegraphed quill
  broodpod:{hp:52, spd:54,  r:18, dmg:9,  xp:3, col:VERD, w:0},     // splits into rootlings when opened
  stumpguard:{hp:128,spd:48,r:22, dmg:17, xp:5, col:INK3, w:0},     // a heavily carved moving wall
};
const ENEMY_ORDER=['husk','creeper','bloat','rootling','needlekin','bellower','inkspitter','broodpod','stumpguard','warden'];
const ENEMY_LORE={
  husk:['THE HUSK','common pressure','Closes steadily and becomes the carrier for most laws written into the horde.'],
  creeper:['THE CREEPER','fast pursuit','Punishes straight retreats. Turn it through trunks before it reaches the scribe.'],
  bloat:['THE BLOAT','path blocker','A slow, broad body that divides escape routes and shelters smaller enemies.'],
  rootling:['THE ROOTLING','gap runner','Threads through trees and living roots that stop larger creatures.'],
  needlekin:['THE NEEDLEKIN','edge striker','Waits outside the crush, then lunges across the final distance.'],
  bellower:['THE BELLOWER','horde support','Its call hastens nearby enemies. Break the voice before fighting the crowd.'],
  inkspitter:['THE INKSPITTER','ranged pressure','Draws a red line before firing, then sidesteps when timber blocks its quill.'],
  broodpod:['THE BROODPOD','splitting threat','A slow pod that opens into a knot of Rootlings when destroyed.'],
  stumpguard:['THE STUMPGUARD','armoured anchor','Blunts small hits and shelters nearby bodies. Break the guard before the crowd.'],
  warden:['THE ORCHARD-WARDEN','final authority','Walks after eight minutes, changes pace at half Vellum, and answers with four attack forms.'],
};
function spawnRate(){
  const m = G.t/60;
  if(G.t<2.5)return 0;
  let r = 1.6 + m*1.55 + Math.pow(m,1.7)*0.30;
  if(G.traits.swarm) r *= 1.33;
  return r;
}
function pickKind(){
  const m = G.t/60;
  const pool=[['husk',0.62]];
  if(m>0.18)pool.push(['creeper',0.30]);
  if(m>0.55)pool.push(['bloat',0.14]);
  if(m>0.75)pool.push(['rootling',G.traits.roots?0.25:0.16]);
  if(m>2.0)pool.push(['broodpod',0.09]);
  if(m>2.6)pool.push(['needlekin',G.traits.needles?0.20:0.12]);
  if(m>3.4)pool.push(['inkspitter',0.08]);
  if(m>4.5)pool.push(['bellower',G.traits.choir?0.14:0.08]);
  if(m>5.8)pool.push(['stumpguard',0.05]);
  let roll=Math.random()*pool.reduce((n,q)=>n+q[1],0);
  for(const [kind,w] of pool){roll-=w;if(roll<=0)return kind;}
  return 'husk';
}
function spawnEnemy(kind, x, y){
  if(G.enemies.length >= MAX_ENEMIES) return null;
  const K = ENEMY_KINDS[kind];

  const natural=x===undefined;
  const hpScale = 1 + m*0.30 + Math.pow(m,1.55)*0.08;
  if(x === undefined){
    const a = rand(TAU);
    const d = Math.max(W,H)*0.62 + rand(140);
    x = G.player.x + Math.cos(a)*d; y = G.player.y + Math.sin(a)*d;
  }
  const e = {
    id:uid(), kind, x, y, vx:0, vy:0, r:K.r,
    hp:K.hp*hpScale, maxhp:K.hp*hpScale, spd:K.spd*(1+m*0.035)*rand(1.08,0.92),
    dmg:K.dmg*(1+m*0.14), xp:K.xp,
    hitT:0, burn:0, burnSrc:0, slow:0, haste:0, risen:false,
    wob: rand(TAU), touch:0,
    special:rand(2.5,0.5), lunging:0,
  };
  if(natural&&m>2.5&&Math.random()<0.028){e.elite=true;e.hp*=2.1;e.maxhp=e.hp;e.r*=1.18;e.dmg*=1.35;e.xp*=3;}
  G.enemies.push(e);
  if(!SV.seenEnemies[kind]){SV.seenEnemies[kind]=true;persist();}
  if(natural&&!G.announced[kind]&&kind!=='husk'){
    G.announced[kind]=true;
    const intro={creeper:['CREEPERS ENTER','fast pursuers; turn them through cover'],bloat:['BLOATS ENTER','slow bodies that divide the path'],rootling:['ROOTLINGS ENTER','small runners slip through narrow gaps'],needlekin:['NEEDLEKIN ENTER','watch the edge of the crush'],bellower:['BELLOWERS ENTER','support voices quicken nearby enemies'],inkspitter:['INKSPITTERS ENTER','the red line warns where the quill will land'],broodpod:['BROODPODS ENTER','opened pods become a knot of runners'],stumpguard:['STUMPGUARDS ENTER','armoured bodies anchor the horde']}[kind];
    if(intro)say(intro[0],intro[1]);
  }

}
function spawnRing(n, radius){

function spawnBoss(){
  const a = rand(TAU), d = Math.max(W,H)*0.55;
  G.boss = {
    x:G.player.x+Math.cos(a)*d, y:G.player.y+Math.sin(a)*d,
    r:56, hp:5200, maxhp:5200, spd:52, phase:1,
    state:'chase', st:0, tell:null, atkCd:3.2, hitT:0, slow:0, burn:0,
  };
  G.bossIntro=3.6;G.bossChapter='THE FINAL CLAUSE';
  if(!SV.seenEnemies.warden){SV.seenEnemies.warden=true;persist();}
  sfx('boss');
  G.shake = 16;
}
function updateBoss(dt){
  const b = G.boss, p = G.player; if(!b) return;
  b.hitT = Math.max(0, b.hitT-dt);
  if(b.burn>0){ b.burn -= dt; b.hp -= 26*dt; }
  if(b.phase===1 && b.hp < b.maxhp*0.5){
    b.phase=2; b.spd*=1.35; b.atkCd=2.1; G.shake=14;
    sfx('phase');
    G.bossIntro=2.4;G.bossChapter='SECOND IMPRESSION  ·  THE THORNS REMEMBER';
  }
  const sp = b.spd * (b.slow>0?0.55:1);
  b.slow = Math.max(0,b.slow-dt);

  b.st += dt;
  if(b.state === 'chase'){
    const a = angTo(b.x,b.y,p.x,p.y);
    b.x += Math.cos(a)*sp*dt; b.y += Math.sin(a)*sp*dt;
    if(b.st > b.atkCd){
      b.st = 0;
      const roll = Math.random();
      b.state = roll < 0.42 ? 'slam' : roll < 0.74 ? 'lash' : 'seed';
      if(b.state==='slam') b.tell = {kind:'ring', x:p.x, y:p.y, r:150, t:0, dur:1.15};
      if(b.state==='lash') b.tell = {kind:'line', a:angTo(b.x,b.y,p.x,p.y), t:0, dur:0.95, len:520, wide:44};
      if(b.state==='seed') b.tell = {kind:'seed', t:0, dur:0.8};
      sfx(b.state==='slam'?'platen':b.state==='lash'?'marginTell':'seedTell');
    }
  } else {
    b.tell.t += dt;
    if(b.tell.t >= b.tell.dur){
      if(b.state==='slam'){
        const T=b.tell;
        sfx('impact',1.35);
        if(dist2(p.x,p.y,T.x,T.y) < T.r*T.r) hurtPlayer(26,'warden');
        burst(T.x,T.y,T.r,'slam');
        for(const e of G.enemies) if(dist2(e.x,e.y,T.x,T.y)<T.r*T.r) damageEnemy(e, 40, 0);
        G.shake = 12;
      } else if(b.state==='lash'){
        const T=b.tell;
        const dx=Math.cos(T.a), dy=Math.sin(T.a);
        const rel = (p.x-b.x)*dx + (p.y-b.y)*dy;
        const off = Math.abs((p.x-b.x)*(-dy) + (p.y-b.y)*dx);
        if(rel>0 && rel<T.len && off < T.wide) hurtPlayer(22,'warden');
        for(let i=0;i<10;i++) fx(b.x+dx*(i*50), b.y+dy*(i*50), RUBRIC, 16);
        G.shake = 9;
      } else {
        for(let i=0;i<9;i++){
          const a = rand(TAU);
          spawnEnemy(Math.random()<0.3?'creeper':'husk', b.x+Math.cos(a)*90, b.y+Math.sin(a)*90);
        }
      }
      b.state='chase'; b.tell=null; b.st=0;
    }
  }
  // contact
  if(dist2(b.x,b.y,p.x,p.y) < (b.r+p.r)*(b.r+p.r)) hurtPlayer(20*dt*3.2,'warden');

  if(b.hp <= 0){
    for(let i=0;i<40;i++) fx(b.x+rand(80,-80), b.y+rand(80,-80), INK, 30);
    // guaranteed haul
    dropGear(b.x, b.y, 3);
    dropGear(b.x+40, b.y+20, 2);
    for(const k of MAT_IDS) G.runMats[k] += 14;
    G.boss = null; G.mode='victory'; SV.wins++; persist();
    sfx('victory');
    G.shake = 20;
  }
}

  const mw = mouseWorld();

  } else if(I.kind === 'lob'){
    sfx('lob');

      x:p.x, y:p.y, a, spd:I.speed, dmg, kind:'lob', life:0,
      travel:0, range:I.range*reach, blast:I.blast*(hasAffix('bellows')?1.2:1),
      pierce:0, forked:false, r:8,

  } else {

      G.projectiles.push({
        x:p.x, y:p.y, a:a+rand(0.04,-0.04), spd:I.speed, dmg, kind:'shot', life:0,
        travel:0, range:900*reach, pierce:(I.pierce||0)+(hasAffix('piercing')?2:0)+(G.cards.some(c=>c.id==='needlehand')?1:0),
        forked:false, r:5,
      });
    }

function damageEnemy(e, amount, knock, srcA){
  if(e.dead) return;
  // Stumpguards shelter nearby lesser bodies, making the formation—not merely
  // the nearest target—the thing a player reads and dismantles.
  if(e.guarded&&e.kind!=='stumpguard')amount*=.76;
  // Ironbark Gloss: bark blunts small cuts far more than big ones
  if(e.bark) amount = amount <= 22 ? amount*0.55 : amount - 10;
  if(e.kind==='stumpguard') amount = amount<=24 ? amount*0.62 : amount-7;
  e.hp -= amount; e.hitT = 0.09;if(amount>=30)G.hitStop=Math.max(G.hitStop,.018);
  sfx('hit',clamp(amount/30,.45,1.25));
  if(G.traits.seal && !e.sealSpent && e.hp <= 0 && Math.random()<0.18){
    e.sealSpent=true; e.hp=e.maxhp*0.18;
    G.fx.push({ring:true,x:e.x,y:e.y,r0:4,r1:e.r+18,t:0,dur:0.35,col:BLUEIN});
  }
  if(knock){
    const a = srcA !== undefined ? srcA : angTo(G.player.x,G.player.y,e.x,e.y);
    e.vx += Math.cos(a)*knock; e.vy += Math.sin(a)*knock;
  }
  if(G.player.burnOn && e.burn <= 0) e.burn = 3.0;
  if(e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  if(e.dead) return;
  e.dead = true;
  G.kills++; G.killsSinceHeal++;
  if(e.elite||e.kind==='stumpguard'||G.kills%7===0)sfx('kill',e.elite?1.4:1);
  const p = G.player;

  // ---- card boons that trigger on kill
  // Per-kill healing does not survive contact with a survivors-like: at 6 kills
  // a second a flat heal-per-kill outruns every damage source in the game.
  // Bounded to a fraction of the kill rate instead.
  if(G.cards.some(c=>c.id==='graverite') && G.kills % 8 === 0) heal(5);
  if(G.cards.some(c=>c.id==='redmargin') && G.kills % 5 === 0) boneShard(e.x,e.y);
  if(G.cards.some(c=>c.id==='blackseal') && G.kills % 25 === 0){
    G.fx.push({ring:true,x:e.x,y:e.y,r0:10,r1:170,t:0,dur:0.5,col:BLUEIN});
    for(const o of G.enemies){ const a=angTo(e.x,e.y,o.x,o.y); if(dist2(e.x,e.y,o.x,o.y)<170*170){o.vx+=Math.cos(a)*320;o.vy+=Math.sin(a)*320;} }
  }
  if(e.kind==='broodpod' && !e.risen){
    sfx('pod');
    for(let j=0;j<3;j++){
      const a=j/3*TAU+rand(0.3),r=spawnEnemy('rootling',e.x+Math.cos(a)*20,e.y+Math.sin(a)*20);
      if(r) r.risen=true;
    }
    G.fx.push({ring:true,x:e.x,y:e.y,r0:8,r1:58,t:0,dur:0.42,col:VERD});
  }
  if(e.elite){
    const available=G.cards.filter(c=>c.mat);
    if(available.length){const mat=pick(available).mat;G.runMats[mat]=(G.runMats[mat]||0)+3;floater('+3 '+MATERIALS[mat].name,e.x,e.y-42,MATERIALS[mat].col);}
    if(Math.random()<0.45)dropGear(e.x,e.y,Math.random()<0.2?3:2);
  }
  if(hasAffix('vigil') && G.kills % 8 === 0) heal(1);
  if(G.doct.oath>=3 && G.killsSinceHeal >= 6){ G.killsSinceHeal = 0; heal(1); }

  // ---- horde traits: revenant
  if(G.traits.revenant && !e.risen){
    const chance = hasAffix('gravecall') ? 0.36 : 0.20;
    if(Math.random() < chance){
      const r = spawnEnemy(e.kind, e.x, e.y);
      if(r){ r.risen = true; r.hp = r.maxhp*0.55; r.tint = RUBRIC; fx(e.x,e.y,RUBRIC,14); }
    }
  }
  // ---- horde traits: ember -> scorch pool
  if(G.traits.ember){
    addPool(e.x, e.y, (30+rand(10))*(hasAffix('bellows')?1.45:1), 6.5,
            hasAffix('emberchain')||G.doct.ember>=5);
  }
  // ---- ember doctrine adds its own pool even without the card
  else if(G.doct.ember >= 3){
    addPool(e.x, e.y, (26+rand(8))*(hasAffix('bellows')?1.45:1), 5.0, G.doct.ember>=5);
  }
  // ---- grave doctrine: corpses
  if(G.doct.grave >= 3){
    G.corpseCount++;
    const cap = 3 + (G.doct.grave>=5?2:0) + (hasAffix('ossuary')?1:0);
    if(G.corpseCount % 4 === 0 && G.minions.length < cap) raiseSkeleton(e.x, e.y);
  }
  if(hasAffix('gravebound') && Math.random()<0.30) boneShard(e.x,e.y);

  // ---- ink (xp)
  const n = e.kind==='bloat' ? 3 : 1;
  for(let i=0;i<n;i++) G.gems.push({x:e.x+rand(14,-14), y:e.y+rand(14,-14), v:e.xp, t:0, vx:rand(40,-40), vy:rand(40,-40)});

  // ---- materials: written traits are the loot table
  for(const c of G.cards){
    if(!c.mat) continue;
    let ch = 0.16;
    if(c.mat==='cinder' && hasAffix('ashglut') && e.burn>0) ch *= 2;
    if(G.traits.swarm) ch *= 1.15;
    if(Math.random() < ch){
      G.runMats[c.mat] = (G.runMats[c.mat]||0) + 1;
      floater('+ '+MATERIALS[c.mat].name, e.x, e.y-22, MATERIALS[c.mat].col);
      if(G.cards.some(x=>x.id==='gildedchoir')) G.player.wardT+=1;
    }
  }
  // a trickle of heartwood always — so a fresh save can craft something
  if(Math.random() < 0.05){ G.runMats.heartwood++; floater('+ Heartwood',e.x,e.y-22,VERD); }

  // ---- gear
  if(Math.random() < ((e.kind==='bloat'||e.kind==='stumpguard') ? 0.045 : 0.014)) dropGear(e.x,e.y);

  fx(e.x,e.y, e.tint||INK, 10);
  const i = G.enemies.indexOf(e); if(i>=0) G.enemies.splice(i,1);
}
/* Scorch pools are spawned per-death, so at high kill rates they can pile into
   the hundreds and each one sweeps the whole enemy list on tick. Cap them, and
   fold a new pool into the nearest existing one instead of allocating. */
const MAX_POOLS = 64;
function addPool(x,y,r,dur,chain){
  if(G.pools.length >= MAX_POOLS){
    let best=null, bd=1e9;
    for(const q of G.pools){ const d=dist2(x,y,q.x,q.y); if(d<bd){bd=d;best=q;} }
    if(best){ best.t = 0; best.dur = Math.max(best.dur,dur); best.r = Math.max(best.r, r);
              best.chain = best.chain||chain; return best; }
  }
  const q = {x,y,r,t:0,dur,tick:0,chain};
  G.pools.push(q);
  return q;
}

function raiseSkeleton(x,y){
  const mul = hasAffix('marrowfed') ? 1.6 : 1;
  G.minions.push({x,y,r:10,hp:40,life:0,dur:14*mul,cd:0,target:null,a:0});
  fx(x,y,BLUEIN,16);
}
function boneShard(x,y){
  let best=null, bd=1e9;
  for(const e of G.enemies){ const d=dist2(x,y,e.x,e.y); if(d<bd){bd=d;best=e;} }
  if(!best) return;
  G.projectiles.push({x, y, a:angTo(x,y,best.x,best.y), spd:520, dmg:18*implPower(),
    kind:'shot', life:0, travel:0, range:420, pierce:1, forked:true, r:4, bone:true});
}
function heal(n){ const p=G.player; p.hp = Math.min(p.maxhp, p.hp+n); floater('+'+n, p.x, p.y-20, VERD); }
function hurtPlayer(n,source){
  const p = G.player;
  if(p.hurtT > 0) return;
  if(p.ward){ p.ward=false; p.wardT=0; floater('WARD', p.x, p.y-24, GOLD); G.shake=6; return; }
  p.hp -= n; p.hurtT = 0.42; G.shake = Math.max(G.shake, 5);G.hitStop=Math.max(G.hitStop,.045);sfx('hurt');
  floater('-'+Math.round(n), p.x, p.y-18, RUBRIC);
  if(p.hp <= 0){ p.hp = 0;G.deathCause=source||'the horde'; G.mode = 'dead';sfx('dead'); }
}
/* Death isn't a puff of dots — the creature un-prints, throwing ink specks

function fx(x,y,col,n){

    const a=rand(TAU), s=rand(170,35);

/* ================================================================ DROPS */
function dropGear(x,y,forceRarity){
  let r = forceRarity;
  if(r === undefined){
    const roll = Math.random();
    r = roll < 0.50 ? 0 : roll < 0.82 ? 1 : roll < 0.965 ? 2 : 3;
  }
  // keyword bias follows the traits you inscribed — the loot table IS the bestiary
  const kws = G.cards.map(c => MATERIALS[c.mat]?.kw).filter(Boolean);
  const kw = kws.length && Math.random() < 0.7 ? pick(kws) : pick(['ember','grave','oath',null]);
  const slot = pick(SLOTS);
  const it = makeItem(slot, r, kw);
  G.drops.push({item:it, x, y, t:0, vy:-40, bob:rand(TAU)});
}
function shatter(it){
  const gain = 2 + it.rarity*3;
  const kws = it.affixes.map(a=>AFFIXES[a].kw).filter(Boolean);
  const mat = kws.length ? matForKw(pick(kws)) : 'heartwood';
  if(G.mode==='run') G.runMats[mat] = (G.runMats[mat]||0)+gain;
  else SV.mats[mat] += gain;
  return {mat, gain};
}
function scoreItem(it){
  if(!it) return -1;
  return it.rarity*10 + it.power*4 + it.affixes.length*3;
}
function tryEquipCompare(){
  if(!G.compare) return;
  const it = G.compare.item;
  const old = SV.loadout[it.slot];
  SV.loadout[it.slot] = it;
  G.runLoot.push(it);
  if(old){ const s = shatter(old); floater('+'+s.gain+' '+MATERIALS[s.mat].name, G.player.x, G.player.y-34, MATERIALS[s.mat].col); }
  G.compare = null;
  recompute();

/* =============================================================== LEVELUP */
/* Levelling is DEFERRED to the end of the step. Resolving it inline let a
   level-up in the same frame as a fatal hit overwrite mode='dead' with
   mode='levelup', and let two level-ups in one frame stomp each other. */
function gainXp(v){
  const p = G.player;
  p.xp += v * p.xpMul;
  while(p.xp >= p.xpNext){
    p.xp -= p.xpNext; p.level++;
    p.xpNext = Math.round(p.xpNext * 1.26 + 3);
    p.pendingLevels = (p.pendingLevels||0) + 1;
  }
}
function offerCards(){
  const taken = new Set(G.cards.map(c=>c.id));
  const avail = CARDS.filter(c=>!taken.has(c.id));
  if(avail.length === 0){
    // bestiary exhausted — small honest filler so levelling still pays
    G.player.maxhp += 6; G.player.hp += 6;
    G.player.atkRate += 0.03;
    floater('SCRIPTORIUM', G.player.x, G.player.y-40, GOLD);
    return;
  }
  const off = [];
  const pool = avail.slice();
  while(off.length < Math.min(3,pool.length)){
    const i = randi(pool.length); off.push(pool.splice(i,1)[0]);
  }
  G.offer = off;
  G.mode = 'levelup';
}
function takeCard(c){
  G.cards.push(c);
  G.traits[c.trait] = true;
  SV.seen[c.id] = true;
  if(c.id === 'ironbark'){ recompute(); G.player.hp = G.player.maxhp; }
  if(c.id === 'oathmark'){ G.player.ward = true; G.player.wardT = 0; }
  recompute();
  persist();
  G.offer = [];
  G.mode = 'run';
  G.inscribeFlash={card:c,t:2.2};
  say('INSCRIBED — ' + c.name.toUpperCase(), c.curse);
  sfx('page');
}

/* ================================================================ UPDATE */
function step(dt){
  dt = Math.min(dt, 1/25);
  G.dt = dt; G.frame++;
  G.turnT=Math.max(0,G.turnT-dt);
  if(G.mode==='run'&&G.hitStop>0){G.hitStop=Math.max(0,G.hitStop-dt);stepFx(dt*.2);return;}
  if(G.mode === 'town'){ updateTown(dt); stepFx(dt); return; }
  if(G.mode !== 'run') { stepFx(dt); return; }
  G.t += dt;
  audioAmbience(dt);
  // Do not consume the first-run guide when a new player leaves or falls
  // before its final lesson. It becomes optional only after all four stages.
  if(G.tutorial&&!SV.tutorialDone&&G.t>=32){SV.tutorialDone=true;persist();}

  const p = G.player;

  /* --- movement --- */
  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])   my-=1;
  if(keys['s']||keys['arrowdown']) my+=1;
  if(keys['a']||keys['arrowleft']) mx-=1;
  if(keys['d']||keys['arrowright'])mx+=1;
  mx+=touch.mx;my+=touch.my;
  const ml = Math.hypot(mx,my) || 1;
  const isMoving = (mx||my) !== 0;
  p.x += (mx/ml)*p.speed*dt; p.y += (my/ml)*p.speed*dt;
  resolveWorldCollision(p,p.r);
  p.x = clamp(p.x,-WORLD,WORLD); p.y = clamp(p.y,-WORLD,WORLD);
  const nextRegion=regionAt(p.x,p.y);
  if(nextRegion!==G.region){G.region=nextRegion;G.regionT=3.2;say(nextRegion,'a different block was used here');}
  G.regionT=Math.max(0,G.regionT-dt);
  G.folioT=Math.max(0,G.folioT-dt);
  G.bossIntro=Math.max(0,G.bossIntro-dt);
  p.hurtT = Math.max(0,p.hurtT-dt);
  // walk cycle advances only while walking, and settles to a stand when not
  p.walk = isMoving ? (p.walk||0) + dt : 0;

  // ward recharge (Oathmark card / Oath t5)
  const wardMax = G.doct.oath>=5 ? 8 : 12;
  if(G.cards.some(c=>c.id==='oathmark') || G.doct.oath>=5){
    if(!p.ward){ p.wardT += dt; if(p.wardT >= wardMax){ p.ward=true; p.wardT=0; } }
  }

  /* --- camera --- */
  G.cam.x = lerp(G.cam.x, p.x, 1-Math.pow(0.0015,dt));
  G.cam.y = lerp(G.cam.y, p.y, 1-Math.pow(0.0015,dt));
  G.shake = Math.max(0, G.shake - dt*22);

  /* --- weapons --- */
  fireWeapons(dt);
  for(const id of Object.keys(SKILLS)) G.skills[id]=Math.max(0,G.skills[id]-dt);

  /* --- spawning --- */
  if(!G.boss && G.t < ZONE_TIME){
    G.spawnAcc += spawnRate()*dt;
    while(G.spawnAcc >= 1){ G.spawnAcc -= 1; spawnEnemy(pickKind()); }
    // pressure waves every 45s
    const w = Math.floor(G.t/45);
    if(w > G.wave){ G.wave = w; spawnFormation(w, Math.max(W,H)*0.55); }
  }
  if(!G.boss && G.t >= ZONE_TIME && G.mode==='run' && !G.bossWarned){ G.bossWarned=true; spawnBoss(); }
  if(G.boss) updateBoss(dt);

  updateSwings(dt);
  updateProjectiles(dt);
  updateShrieks(dt);
  updateEnemies(dt);
  updateEnemyProjectiles(dt);
  updateMinions(dt);
  updatePools(dt);
  updatePickups(dt);
  stepFx(dt);

  if(G.compare){ G.compare.t -= dt; if(G.compare.t <= 0){
    const s = shatter(G.compare.item);
    floater('+'+s.gain+' '+MATERIALS[s.mat].name, p.x, p.y-34, MATERIALS[s.mat].col);
    G.compare = null;
  }}
  if(G.msg){ G.msg.t -= dt; if(G.msg.t<=0) G.msg=null; }
  if(G.inscribeFlash){G.inscribeFlash.t-=dt;if(G.inscribeFlash.t<=0)G.inscribeFlash=null;}

  // resolve deferred level-ups last, and never over the top of a death
  if(G.mode === 'run' && p.pendingLevels > 0){ p.pendingLevels--; offerCards(); }
}

function updateSwings(dt){
  for(let i=G.swings.length-1;i>=0;i--){
    const s = G.swings[i]; s.t += dt;
    // follow the player so the arc reads as attached to them
    s.x = G.player.x; s.y = G.player.y;
    if(s.t > 0.03 && s.t < 0.16){
      for(const e of G.enemies){
        if(s.hit[e.id]) continue;
        const d2 = dist2(s.x,s.y,e.x,e.y);
        const rr = (s.reach+e.r);
        if(d2 > rr*rr) continue;
        if(Math.abs(angDiff(angTo(s.x,s.y,e.x,e.y), s.a)) > s.arc/2) continue;
        s.hit[e.id] = 1;
        onHit(e, s.dmg, angTo(s.x,s.y,e.x,e.y));
      }
      if(G.boss && !s.hit.boss){
        const b=G.boss, rr=s.reach+b.r;
        if(dist2(s.x,s.y,b.x,b.y) <= rr*rr && Math.abs(angDiff(angTo(s.x,s.y,b.x,b.y), s.a)) <= s.arc/2){
          s.hit.boss=1; b.hp -= s.dmg; b.hitT=0.1;sfx('hit',clamp(s.dmg/30,.45,1.2)); floater(Math.round(s.dmg), b.x, b.y-b.r, PARCH);
        }
      }
    }
    if(s.t >= s.dur) G.swings.splice(i,1);
  }
}
function onHit(e, dmg, a){
  const p = G.player;
  p.hitStreak++;
  let knock = 60;
  if(G.cards.some(c=>c.id==='pallscript')) e.slow=Math.max(e.slow,0.65);
  if(hasAffix('driving') && p.hitStreak % 3 === 0) knock = 340;
  damageEnemy(e, dmg, knock, a);
  floater(Math.round(dmg), e.x, e.y-e.r-4, PARCH);
}

function projectileBlocked(x,y,r){
  for(const w of G.walls)if(x>w.x-w.w/2&&x<w.x+w.w/2&&y>w.y-w.h/2&&y<w.y+w.h/2)return true;
  for(const t of G.trees)if(dist2(x,y,t.x,t.y)<Math.pow(12*t.s+r,2))return true;
  for(const L of G.landmarks){const cr=L.kind==='press'?58:L.kind==='well'?46:L.kind==='nest'?35:L.kind==='effigy'?24:0;if(cr&&dist2(x,y,L.x,L.y+12)<Math.pow(cr+r,2))return true;}
  return false;
}
function lineBlocked(ax,ay,bx,by){
  for(let i=1;i<8;i++){const k=i/8;if(projectileBlocked(lerp(ax,bx,k),lerp(ay,by,k),3))return true;}
  return false;
}
function updateProjectiles(dt){
  for(let i=G.projectiles.length-1;i>=0;i--){
    const q = G.projectiles[i];
    const ox=q.x,oy=q.y;
    const stepd = q.spd*dt;
    q.x += Math.cos(q.a)*stepd; q.y += Math.sin(q.a)*stepd;
    q.travel += stepd; q.life += dt;

    let done = false;
    if(q.kind === 'lob'){
      let hitE = null;
      for(const e of G.enemies){ const rr=e.r+q.r; if(dist2(q.x,q.y,e.x,e.y)<rr*rr){hitE=e;break;} }
      if(hitE || q.travel >= q.range){
        sfx('impact');
        burst(q.x,q.y,q.blast,'lob');
        for(const e of G.enemies){
          if(dist2(q.x,q.y,e.x,e.y) < q.blast*q.blast) onHit(e, q.dmg, angTo(q.x,q.y,e.x,e.y));
        }
        if(G.boss && dist2(q.x,q.y,G.boss.x,G.boss.y) < (q.blast+G.boss.r)*(q.blast+G.boss.r)){
          G.boss.hp -= q.dmg; G.boss.hitT=0.1;sfx('hit',clamp(q.dmg/30,.45,1.2));
        }
        if(G.traits.ember || G.doct.ember>=3) addPool(q.x, q.y, q.blast*0.55, 3.0, false);
        done = true;
      }
    } else {
      if(projectileBlocked(q.x,q.y,q.r)||projectileBlocked((q.x+ox)/2,(q.y+oy)/2,q.r)){fx(q.x,q.y,INK2,3);done=true;}
      for(const e of done?[]:G.enemies){
        const rr = e.r+q.r;
        if(dist2(q.x,q.y,e.x,e.y) < rr*rr){
          if(q.hitset && q.hitset[e.id]) continue;
          (q.hitset = q.hitset||{})[e.id]=1;
          onHit(e, q.dmg, q.a);
          if(hasAffix('forking') && !q.forked){
            q.forked = true;
            for(const off of [-0.45,0.45]){
              G.projectiles.push({x:q.x,y:q.y,a:q.a+off,spd:q.spd,dmg:q.dmg*0.65,kind:'shot',
                life:0,travel:0,range:q.range*0.6,pierce:0,forked:true,r:4});
            }
          }
          if(q.pierce > 0) q.pierce--; else { done = true; }
          break;
        }
      }
      if(!done && G.boss){
        const rr = G.boss.r+q.r;
        if(dist2(q.x,q.y,G.boss.x,G.boss.y) < rr*rr){
          G.boss.hp -= q.dmg; G.boss.hitT=0.1;sfx('hit',clamp(q.dmg/30,.45,1.2));
          floater(Math.round(q.dmg), q.x, q.y, PARCH);
          if(q.pierce>0) q.pierce--; else done = true;
        }
      }
    }
    if(q.travel >= q.range) done = true;
    if(done) G.projectiles.splice(i,1);
  }
}

/* Oathmark's curse. Rate-limited globally rather than per-enemy: one shriek
   every few seconds reads as a pressure spike, whereas 300 husks each on their
   own timer is both constant haste and an O(n²) sweep. */
function updateShrieks(dt){
  if(!G.traits.shriek || !G.enemies.length) return;
  G.shriekT = (G.shriekT||0) - dt;
  if(G.shriekT > 0) return;
  G.shriekT = rand(5.5, 3.0);
  const e = pick(G.enemies);
  e.haste = 2.4;
  G.fx.push({ring:true, x:e.x, y:e.y, r0:8, r1:190, t:0, dur:0.45, col:GOLD});
  for(const o of G.enemies) if(o!==e && dist2(o.x,o.y,e.x,e.y) < 190*190) o.haste = 2.0;
}

function updateEnemies(dt){
  const p = G.player;
  const auraR = (G.doct.oath>=3) ? 128*(hasAffix('oathkeeper')?1.4:1) : 0;
  const thorn = !!G.traits.thorns;

  for(const e of G.enemies)e.guarded=false;
  for(const guard of G.enemies)if(guard.kind==='stumpguard')for(const e of G.enemies)if(e!==guard&&dist2(e.x,e.y,guard.x,guard.y)<118*118)e.guarded=true;

  for(let i=G.enemies.length-1;i>=0;i--){
    const e = G.enemies[i];
    e.hitT = Math.max(0,e.hitT-dt);
    e.wob += dt*3;

    // burn DoT
    if(e.burn > 0){
      e.burn -= dt; e.burnSrc = (e.burnSrc||0) + dt;
      if(e.burnSrc >= 0.4){ e.burnSrc = 0; damageEnemy(e, 5*implPower(), 0); if(e.dead) continue; }
    }

    let spd = e.spd;
    if(e.slow > 0){ e.slow -= dt; spd *= 0.6; }
    if(e.haste > 0){ e.haste -= dt; spd *= 1.55; }

    // Distinct silhouettes also carry distinct jobs in the crowd.
    if(e.kind==='needlekin'){
      e.special -= dt;
      const d = Math.sqrt(dist2(e.x,e.y,p.x,p.y));
      if(e.special<=0 && d>95 && d<250){ e.special=3.2; e.lunging=0.42; }
      if(e.lunging>0){ e.lunging-=dt; spd*=2.65; }
    }
    if(e.kind==='bellower'){
      e.special -= dt;
      if(e.special<=0){
        e.special=5.5;
        sfx('bell');
        G.fx.push({ring:true,x:e.x,y:e.y,r0:10,r1:150,t:0,dur:0.5,col:GOLD});
        for(const o of G.enemies) if(o!==e && dist2(o.x,o.y,e.x,e.y)<150*150) o.haste=1.8;
      }
    }
    if(e.kind==='inkspitter'){
      e.special-=dt;
      e.losT=(e.losT||0)-dt;if(e.losT<=0){e.losT=.16+e.id%4*.025;e.seekingLine=lineBlocked(e.x,e.y,p.x,p.y);}
      if(e.windup>0){
        e.windup-=dt;spd*=0.18;
        if(e.windup<=0){
          const qa=angTo(e.x,e.y,p.x,p.y);
          G.eprojectiles.push({x:e.x,y:e.y,a:qa,spd:245,r:5,dmg:e.dmg,life:0,max:3.2});
        }
      } else if(e.special<=0&&!e.seekingLine&&dist2(e.x,e.y,p.x,p.y)<410*410){e.special=3.4;e.windup=0.72;sfx('quill');}
    }
    if(G.traits.frenzy && e.hp<e.maxhp*0.5) spd*=1.28;
    if(G.traits.seal && !e.sealSpent && e.hp<1){ e.sealSpent=true; e.hp=e.maxhp*0.18; }

    // Oath aura: slow + shove
    const inAura = auraR>0 && dist2(e.x,e.y,p.x,p.y) < auraR*auraR;
    if(inAura){
      spd *= hasAffix('litany') ? 0.55 : 0.75;
      if(hasAffix('bulwark')){
        const a = angTo(p.x,p.y,e.x,e.y);
        e.vx += Math.cos(a)*90*dt*6; e.vy += Math.sin(a)*90*dt*6;
      }
    }

    let a = angTo(e.x,e.y,p.x,p.y),move=1;
    if(e.kind==='inkspitter'){
      const d2p=dist2(e.x,e.y,p.x,p.y);
      if(e.seekingLine){a+=(e.id%2?1:-1)*Math.PI*.46;move=1;}
      else if(d2p<205*205)a+=Math.PI;else if(d2p<315*315)move=0;
    }
    e.x += (Math.cos(a)*spd*move + e.vx)*dt;
    e.y += (Math.sin(a)*spd*move + e.vy)*dt;
    resolveWorldCollision(e,e.r);
    // Local-only separation prevents stacked silhouettes without an O(n²) pass.
    for(let j=Math.max(0,i-5);j<i;j++){
      const o=G.enemies[j];if(!o||o.dead)continue;
      const dx=e.x-o.x,dy=e.y-o.y,d=Math.hypot(dx,dy),min=(e.r+o.r)*0.72;
      if(d>0&&d<min){const q=(min-d)*0.5;e.x+=dx/d*q;e.y+=dy/d*q;o.x-=dx/d*q;o.y-=dy/d*q;}
    }
    e.vx *= Math.pow(0.0009,dt); e.vy *= Math.pow(0.0009,dt);


    // contact damage
    const rr = e.r + p.r;
    if(dist2(e.x,e.y,p.x,p.y) < rr*rr){
      e.touch -= dt;
      if(e.touch <= 0){ e.touch = 0.55; hurtPlayer(e.dmg,e.kind); }
    }
    // thorn trait — a hurt-radius, not just contact
    if(thorn){
      const tr = e.r + p.r + 16;
      if(dist2(e.x,e.y,p.x,p.y) < tr*tr){
        e.thornT = (e.thornT||0) - dt;
        if(e.thornT <= 0){ e.thornT = 1.0; hurtPlayer(e.dmg*0.35,e.kind); }
      }
    }
    // bark trait — flat reduction handled at damage time via marker
    e.bark = !!G.traits.bark;
  }
}

function updateMinions(dt){
  for(let i=G.minions.length-1;i>=0;i--){
    const m = G.minions[i];
    m.life += dt;
    if(m.life >= m.dur){
      if(G.doct.grave >= 5){
        for(let k=0;k<5;k++){
          const a = (k/5)*TAU;
          G.projectiles.push({x:m.x,y:m.y,a,spd:460,dmg:16*implPower(),kind:'shot',
            life:0,travel:0,range:300,pierce:1,forked:true,r:4,bone:true});
        }
      }
      fx(m.x,m.y,BLUEIN,10);
      G.minions.splice(i,1); continue;
    }
    // find target
    if(!m.target || m.target.dead || dist2(m.x,m.y,m.target.x,m.target.y) > 520*520){
      let best=null,bd=1e9;
      for(const e of G.enemies){ const d=dist2(m.x,m.y,e.x,e.y); if(d<bd){bd=d;best=e;} }
      m.target = best;
    }
    const tgt = m.target || G.player;
    const a = angTo(m.x,m.y,tgt.x,tgt.y); m.a = a;
    const d = Math.hypot(tgt.x-m.x, tgt.y-m.y);
    if(d > 26){ m.x += Math.cos(a)*150*dt; m.y += Math.sin(a)*150*dt; }
    m.cd -= dt;
    if(m.target && d < 34 && m.cd <= 0){
      m.cd = 0.6;
      damageEnemy(m.target, 14*implPower(), 90, a);
      fx(m.x+Math.cos(a)*18, m.y+Math.sin(a)*18, BLUEIN, 4);
    }
  }
}

function updatePools(dt){
  const p = G.player;
  for(let i=G.pools.length-1;i>=0;i--){
    const q = G.pools[i];
    q.t += dt; q.tick -= dt;
    if(q.tick <= 0){
      q.tick = 0.35;
      for(const e of G.enemies){
        if(dist2(e.x,e.y,q.x,q.y) < q.r*q.r){
          damageEnemy(e, 7*implPower(), 0);
          if(!e.dead && e.burn<=0) e.burn = 2.0;
        }
      }
      if(G.boss && dist2(G.boss.x,G.boss.y,q.x,q.y) < (q.r+G.boss.r)*(q.r+G.boss.r)) G.boss.hp -= 6;
      // the fire you wrote burns you too — but only from the trait, not the doctrine
      if(G.traits.ember && dist2(p.x,p.y,q.x,q.y) < q.r*q.r) hurtPlayer(3,'scorch');
      if(q.chain && Math.random()<0.5){
        let best=null,bd=1e9;
        for(const e of G.enemies){ const d=dist2(q.x,q.y,e.x,e.y); if(d<bd && d<260*260){bd=d;best=e;} }
        if(best){
          G.fx.push({line:true,x1:q.x,y1:q.y,x2:best.x,y2:best.y,t:0,dur:0.18,col:RUBRIC2});
          damageEnemy(best, 11*implPower(), 0);
        }
      }
    }
    if(q.t >= q.dur) G.pools.splice(i,1);
  }
}

function updatePickups(dt){
  const p = G.player;
  // The Black Well gathers loose ink into a legible, valuable bead. This keeps
  // late waves from becoming a carpet of identical black flecks without
  // deleting any earned experience.
  const well=G.landmarks.find(L=>L.kind==='well');
  if(well){
    let gathered=0;
    for(let i=G.gems.length-1;i>=0&&gathered<3;i--){
      const g=G.gems[i],d=Math.hypot(g.x-well.x,g.y-well.y);
      if(d<245&&d>24){const a=angTo(g.x,g.y,well.x,well.y),pull=(260-d)*1.6;g.x+=Math.cos(a)*pull*dt;g.y+=Math.sin(a)*pull*dt;}
      if(d<27){well.charge+=g.v;G.gems.splice(i,1);gathered++;}
    }
    if(well.charge>=8){G.gems.push({x:well.x,y:well.y-18,v:well.charge,vx:rand(34,-34),vy:-55,t:0,large:true});well.charge=0;fx(well.x,well.y,BLUEIN,8);}
  }
  // Merge the oldest nearby droplets when the page gets busy. Value is
  // conserved, while the remaining beads become easier to distinguish.
  if(G.gems.length>95){
    const a=G.gems[0];
    for(let j=G.gems.length-1;j>0;j--){const b=G.gems[j];if(dist2(a.x,a.y,b.x,b.y)<90*90){a.v+=b.v;a.large=true;G.gems.splice(j,1);if(G.gems.length<=82)break;}}
  }
  for(let i=G.gems.length-1;i>=0;i--){
    const g = G.gems[i]; g.t += dt;
    g.x += g.vx*dt; g.y += g.vy*dt; g.vx*=Math.pow(0.002,dt); g.vy*=Math.pow(0.002,dt);
    const d2 = dist2(g.x,g.y,p.x,p.y);
    if(d2 < p.pickup*p.pickup){
      const a = angTo(g.x,g.y,p.x,p.y);
      const pull = 340 * (1 - Math.sqrt(d2)/p.pickup) + 120;
      g.x += Math.cos(a)*pull*dt; g.y += Math.sin(a)*pull*dt;
    }
    const grab=16+Math.min(10,Math.sqrt(g.v)*2);
    if(d2 < grab*grab){ gainXp(g.v);if(g.large||Math.random()<.08)sfx('pickup');G.gems.splice(i,1); }
  }
  for(let i=G.drops.length-1;i>=0;i--){
    const d = G.drops[i]; d.t += dt; d.bob += dt*2.4;
    if(dist2(d.x,d.y,p.x,p.y) < 30*30){
      if(G.compare){ // already holding one — shatter the old prompt
        const s = shatter(G.compare.item);
        floater('+'+s.gain+' '+MATERIALS[s.mat].name, p.x, p.y-34, MATERIALS[s.mat].col);
      }
      G.compare = {item:d.item, t:6.0};
      G.drops.splice(i,1);
    }
  }
  for(const L of G.landmarks){
    const near=dist2(p.x,p.y,L.x,L.y);
    if(!L.discovered&&near<150*150){L.discovered=true;floater('LANDMARK RECORDED',L.x,L.y-72,BLUEIN);}
    if(L.kind==='camp'&&!L.used&&near<88*88&&p.hp<p.maxhp){L.used=true;p.hp=Math.min(p.maxhp,p.hp+Math.max(24,p.maxhp*.35));say('THE LAST DESK','a sealed ration restores the scribe');fx(L.x,L.y,GOLD2,14);}
    if(L.kind==='folio'&&!L.read&&near<105*105){L.read=true;say('THE HANGING FOLIO','the field index remains open for one minute');G.folioT=60;}
    if(L.kind==='nest'&&!L.opened&&near<150*150){L.opened=true;say('THE ROOT BROOD','something answers beneath the binding');spawnEnemy('broodpod',L.x,L.y);for(let n=0;n<4;n++){const a=n/4*TAU;spawnEnemy(n%2?'rootling':'stumpguard',L.x+Math.cos(a)*72,L.y+Math.sin(a)*72);}}
    if(L.kind==='press'&&near<250*250){L.cd-=dt;if(L.cd<=0){L.cd=6;let hit=0;for(const e of G.enemies){if(dist2(e.x,e.y,L.x,L.y)<230*230){damageEnemy(e,28*implPower(),80);hit++;}}if(hit){sfx('impact',1.2);burst(L.x,L.y,230,'press');say('THE BROKEN PRESS','its platen falls across the clearing');}}}
    if(L.kind==='effigy'&&!L.awake&&near<130*130){L.awake=true;p.ward=true;p.wardT=0;p.hp=Math.min(p.maxhp,p.hp+15);const e=spawnEnemy('stumpguard',L.x,L.y+95);if(e){e.elite=true;e.hp*=2;e.maxhp=e.hp;e.xp*=3;}say('THE WARDEN EFFIGY','a ward is granted; its keeper wakes');}
  }
}

function stepFx(dt){
  for(let i=G.fx.length-1;i>=0;i--){
    const f = G.fx[i]; f.t += dt;
    if(!f.ring && !f.line){ f.x += f.vx*dt; f.y += f.vy*dt; f.vx*=Math.pow(0.02,dt); f.vy*=Math.pow(0.02,dt); }
    if(f.t >= f.dur) G.fx.splice(i,1);
  }
  for(let i=G.floaters.length-1;i>=0;i--){
    const f = G.floaters[i]; f.t += dt; f.y -= 34*dt;
    if(f.t >= f.dur) G.floaters.splice(i,1);
  }
}

/* ================================================================= DRAW */
function draw(){
  ctx.save();
  // parchment
  ctx.fillStyle = PARCH; ctx.fillRect(0,0,W,H);
  if(PAPER){ ctx.fillStyle = PAPER; ctx.fillRect(0,0,W,H); }

  if(G.mode === 'menu'){ drawMenu(); ctx.restore(); drawGrain();drawPageTurn(); return; }
  if(G.mode === 'town'){ drawTown(); ctx.restore(); drawGrain();drawPageTurn(); return; }
  if(G.mode === 'forge'){ drawForge(); ctx.restore(); drawGrain();drawPageTurn(); return; }
  if(G.mode === 'archive'){ drawArchive(); ctx.restore(); drawGrain();drawPageTurn(); return; }
  if(G.mode === 'settings'){ drawSettings(); ctx.restore(); drawGrain();drawPageTurn(); return; }

  const shake=SV.settings.shake?G.shake:0;
  const sx = shake ? rand(shake,-shake) : 0;
  const sy = shake ? rand(shake,-shake) : 0;
  ctx.translate(W/2 - G.cam.x + sx, H/2 - G.cam.y + sy);

  drawGround();
  drawWaymarks();
  drawLandmarks();
  drawBarriers();
  drawPools();
  drawTrees();
  drawGems();
  drawDrops();
  drawMinions();
  drawEnemies();
  if(G.boss) drawBoss();
  drawPlayer();
  drawSwings();
  drawProjectiles();
  drawFx();
  drawFloaters();

function drawGround(){

  // navigational textures, not decoration layered over combat silhouettes.

  ctx.strokeStyle=RUBRIC;ctx.lineWidth=1.2;for(let x=420;x<1500;x+=92){ctx.beginPath();ctx.moveTo(x,-880);ctx.lineTo(x+36,1180);ctx.stroke();}

  ctx.fillStyle=INK2;ctx.font='700 14px Georgia,serif';ctx.textAlign='center';for(let i=0;i<18;i++){const x=-1450+(i%6)*145,y=-650+Math.floor(i/6)*180;ctx.save();ctx.translate(x,y);ctx.rotate(((i*17)%9-4)*.05);ctx.fillText(String.fromCharCode(65+(i*7)%26),0,0);ctx.restore();}
  ctx.strokeStyle=BLUEIN;ctx.lineWidth=1.4;for(let r=120;r<520;r+=95){ctx.beginPath();ctx.arc(0,-1380,r,-2.75,-.38);ctx.stroke();}
  ctx.restore();

  ctx.strokeStyle = 'rgba(80,64,40,0.07)'; ctx.lineWidth = 1;
  ctx.beginPath();
  const gap = 46;
  for(let y = Math.floor(y0/gap)*gap; y < y1; y += gap){ ctx.moveTo(x0,y); ctx.lineTo(x1,y); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(164,36,59,0.10)'; ctx.lineWidth = 1.4;

function drawPools(){
  const t = G.t;
  for(const q of G.pools){
    if(q.seed === undefined) q.seed = Math.random()*100;
    const k = 1 - q.t/q.dur;
    const r = q.r*(0.72+0.28*k);
    ctx.save();
    /* A scorch MARK, not a puddle. These stack 60-deep at high kill rates, so
       the fill has to stay near-transparent or the whole page turns pink and
       the horde stops reading against it. Char first, fire only at the core. */
    ctx.globalAlpha = 0.10 + 0.10*k;
    const g = ctx.createRadialGradient(q.x,q.y,r*0.05,q.x,q.y,r);
    g.addColorStop(0, '#6b2b1c'); g.addColorStop(0.55, 'rgba(107,43,28,0.45)');
    g.addColorStop(1, 'rgba(70,40,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(q.x,q.y,r,0,TAU); ctx.fill();

    const edge = (rr0) => {
      ctx.beginPath();
      for(let i=0;i<=16;i++){
        const a=(i/16)*TAU;
        const rr = rr0*(0.90 + 0.10*Math.sin(a*3.3 + q.seed));
        i?ctx.lineTo(q.x+Math.cos(a)*rr, q.y+Math.sin(a)*rr)

    ctx.globalAlpha = 0.26*k; ctx.strokeStyle = INK3; ctx.lineWidth = 1.6; edge(r); ctx.stroke();
    // the live fire is a small bright core, and it flickers
    const core = r*0.34*(0.85+0.15*Math.sin(t*9+q.seed));
    ctx.globalAlpha = 0.42*k; ctx.fillStyle = RUBRIC2;
    ctx.beginPath(); ctx.arc(q.x,q.y,core,0,TAU); ctx.fill();
    // a couple of embers lifting off
    ctx.globalAlpha = 0.75*k; ctx.fillStyle = GOLD2;
    for(let i=0;i<2;i++){
      const a = q.seed + i*2.6 + t*1.4;

      ctx.arc(q.x+Math.cos(a)*rr, q.y+Math.sin(a)*rr - (t*9+i*11)%14, 1.15, 0, TAU);

/* Blit a baked sprite, flipped to face travel, with a white flash on hit.
   The flash is done by drawing the sprite as a solid parchment silhouette
   (source-atop over a filled rect) rather than tinting per-pixel. */
function blit(img, x, y, scale, flip, alpha){
  const w = img.width/SS*scale, h = img.height/SS*scale;
  ctx.save();
  if(alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if(flip) ctx.scale(-1,1);
  ctx.drawImage(img, -w/2, -h*0.72, w, h);
  ctx.restore();
}

function drawImplement(p, a){

  const kick = I.kind==='shot' ? (1-Math.min(since*5,1))*3 : 0;
  ctx.save();
  ctx.translate(p.x + Math.cos(a)*(7-kick), p.y + Math.sin(a)*(7-kick) - 2);
  ctx.rotate(a + (flip ? Math.PI : 0));

function drawSwings(){

function drawFx(){

      // an expanding ring drawn as a wobbling carved circle
      ctx.globalAlpha = k*0.9;

      const r = lerp(f.r0,f.r1,u);

        const a=(i/16)*TAU, rr=r*(0.95+0.05*Math.sin(a*4+f.t*9));

      }
      ctx.closePath(); ctx.stroke();
    } else if(f.line){
      ctx.globalAlpha = k;

      // arc the chain rather than drawing a straight ruler line
      const mx=(f.x1+f.x2)/2, my=(f.y1+f.y2)/2;

      ctx.translate(f.x,f.y);

function spawnFormation(w,radius){
  const p=G.player,a=rand(TAU),cx=p.x+Math.cos(a)*radius,cy=p.y+Math.sin(a)*radius;

  if(kind===0){ // guarded pod cluster
    spawnEnemy('broodpod',cx,cy);for(let i=0;i<5;i++){const q=i/5*TAU;spawnEnemy(i%2?'husk':'stumpguard',cx+Math.cos(q)*70,cy+Math.sin(q)*70);}

    for(let i=-2;i<=2;i++)spawnEnemy('inkspitter',cx+Math.cos(a+Math.PI/2)*i*42,cy+Math.sin(a+Math.PI/2)*i*42);

}

function updateEnemyProjectiles(dt){
  const p=G.player;
  for(let i=G.eprojectiles.length-1;i>=0;i--){
    const q=G.eprojectiles[i],ox=q.x,oy=q.y;q.life+=dt;q.x+=Math.cos(q.a)*q.spd*dt;q.y+=Math.sin(q.a)*q.spd*dt;
    let done=q.life>=q.max;
    if(!done)done=projectileBlocked(q.x,q.y,q.r)||projectileBlocked((q.x+ox)/2,(q.y+oy)/2,q.r);
    if(!done&&dist2(q.x,q.y,p.x,p.y)<(q.r+p.r)*(q.r+p.r)){hurtPlayer(q.dmg,'inkspitter');done=true;}
    if(done){fx(q.x,q.y,RUBRIC,5);G.eprojectiles.splice(i,1);}
  }
  for(const q of G.eprojectiles){
    ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.a);ctx.strokeStyle=RUBRIC;ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(5,0);ctx.stroke();ctx.fillStyle=INK;ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(1,-4);ctx.lineTo(1,4);ctx.closePath();ctx.fill();ctx.restore();
  }
}

function pageBuildRead(c){
  const base=SV.loadout.implement?.base,kw=MATERIALS[c.mat||'heartwood'].kw;
  if(c.id==='needlehand'&&base==='longbow')return ['LONGBOW SYNERGY',RUBRIC];
  if(c.id==='emberbrand'&&base==='censer')return ['BLACK BLOOM SYNERGY',BLUEIN];
  if(c.id==='pallscript'&&base==='greatsword')return ['SWEEP CONTROL',INK2];
  if(c.id==='thornwrit')return ['ATTACK CADENCE',RUBRIC];
  if(c.id==='rootledger')return ['POSITIONING',VERD];
  if(kw&&G.doct[kw]>0)return ['EXTENDS '+DOCTRINES[kw].name.toUpperCase()+' '+G.doct[kw]+'/3',DOCTRINES[kw].col];
  if(c.id==='oathmark'||c.id==='ironbark')return ['SURVIVAL',GOLD];
  return ['NEW FORGE LINE',MATERIALS[c.mat||'heartwood'].col];
}

function drawLevelUp(){

  const offer = G.offer.slice();
  const n = offer.length;
  if(!n){ ctx.restore(); return; }
  const cw = Math.min(320, (W-80)/n - 16), gap = 16;
  const total = n*cw + (n-1)*gap;

  ctx.textAlign='center'; ctx.fillStyle=INK2; ctx.font='500 11px Georgia, serif';
  ctx.fillText('click a page, or press 1 · 2 · 3', W/2, H-30);

function wrap(text,x,y,w,lh,col,font){
  ctx.save(); ctx.font=font; ctx.fillStyle=col; ctx.textAlign='left';
  const words = text.split(' '); let line='', yy=y;
  for(const wd of words){
    const t = line?line+' '+wd:wd;
    if(ctx.measureText(t).width > w && line){ ctx.fillText(line,x,yy); line=wd; yy+=lh; }
    else line=t;
  }
  if(line) ctx.fillText(line,x,yy);
  ctx.restore();
}
function wrapH(text,w,lh,font){
  ctx.save(); ctx.font=font;
  const words=text.split(' '); let line='',n=1;
  for(const wd of words){ const t=line?line+' '+wd:wd;
    if(ctx.measureText(t).width>w && line){line=wd;n++;} else line=t; }
  ctx.restore(); return n*lh;
}

function drawMenu(){

  ctx.strokeStyle=RUBRIC; ctx.lineWidth=1; ctx.strokeRect(bx+6,by+6,bw-12,bh-12);
  ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.strokeRect(bx+11,by+11,bw-22,bh-22);
  // corner ornaments — a carved leaf at each corner of the block
  for(const [ox,oy,sx,sy] of [[bx,by,1,1],[bx+bw,by,-1,1],[bx,by+bh,1,-1],[bx+bw,by+bh,-1,-1]]){
    ctx.save(); ctx.translate(ox,oy); ctx.scale(sx,sy);

  }

  const cy = H*0.36;

  ctx.save();

function updateTown(dt){
  const p=G.townPlayer; let x=0,y=0;
  G.townNotice=Math.max(0,G.townNotice-dt);
  if(keys.w||keys.arrowup)y--; if(keys.s||keys.arrowdown)y++;
  if(keys.a||keys.arrowleft)x--; if(keys.d||keys.arrowright)x++;
  if((x||y)&&G.townTarget)G.townTarget=null;
  if(!x&&!y&&G.townTarget){const dx=G.townTarget.x-p.x,dy=G.townTarget.y-p.y,d=Math.hypot(dx,dy);if(d>6){x=dx/d;y=dy/d;}else G.townTarget=null;}
  const n=Math.hypot(x,y)||1;
  if(x||y){ p.x+=x/n*150*dt; p.y+=y/n*150*dt; p.face=Math.atan2(y,x); p.walk+=dt; }
  p.x=clamp(p.x,-360,360); p.y=clamp(p.y,-220,230);
  G.townNear=null;
  for(const s of TOWN_SITES) if(dist2(p.x,p.y,s.x,s.y)<s.r*s.r) G.townNear=s;
  if(G.townIntro>0) G.townIntro-=dt;
}
